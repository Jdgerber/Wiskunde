<!DOCTYPE html>
<html lang="af" manifest="cache.appcache">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wiskunde">
<title>Wiskunde Pret!</title>
<style>
*{-webkit-box-sizing:border-box;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;
  font-family:"Baloo 2","Chalkboard SE","Comic Sans MS","Segoe UI",Helvetica,Arial,sans-serif}
body{background:linear-gradient(#8fd3ff 0%,#d6f1ff 55%,#b8f0a8 55.1%,#8fe07a 100%);color:#3b2a6b}
svg{display:block}
.hide{display:none !important}
.cloud{position:fixed;opacity:.9;-webkit-animation:drift 60s linear infinite;animation:drift 60s linear infinite;pointer-events:none}
@-webkit-keyframes drift{from{-webkit-transform:translateX(-30vw)}to{-webkit-transform:translateX(120vw)}}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(120vw)}}
header{position:fixed;top:0;left:0;right:0;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;padding:1.5vmin 2vmin;z-index:5}
.right{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.right .pill{margin-left:1.5vmin}
.pill{background:#fff;border-radius:99px;padding:1vmin 2.5vmin;font-size:6vmin;font-weight:800;-webkit-box-shadow:0 .6vmin 0 rgba(0,0,0,.13);box-shadow:0 .6vmin 0 rgba(0,0,0,.13);border:0;cursor:pointer;color:#3b2a6b;-webkit-appearance:none;font-family:inherit;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.pill:active{-webkit-transform:translateY(.4vmin);transform:translateY(.4vmin)}
#stars svg{margin-right:1vmin}
#stars.pop{-webkit-animation:pop .5s;animation:pop .5s}
main{position:absolute;top:0;left:0;right:0;bottom:0;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;padding:11vmin 3vmin 3vmin}
h1{font-size:9vmin;margin:0 0 3vmin;text-shadow:0 .6vmin 0 #fff;text-align:center}
#menu{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center;width:92vw;max-width:150vmin}
.card{width:48%;margin:1%;border-radius:4vmin;padding:3vmin;font-size:6.5vmin;font-weight:800;color:#fff;cursor:pointer;text-align:center;
  -webkit-box-shadow:0 1.2vmin 0 rgba(0,0,0,.2);box-shadow:0 1.2vmin 0 rgba(0,0,0,.2);display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center}
.card span{display:block;margin-bottom:1vmin}
.card:active{-webkit-transform:translateY(1vmin);transform:translateY(1vmin);-webkit-box-shadow:0 .2vmin 0 rgba(0,0,0,.2);box-shadow:0 .2vmin 0 rgba(0,0,0,.2)}
.c1{background:#ff7a59}.c2{background:#3fb6ff}.c3{background:#a66bff}.c4{background:#2fc77a}
#play{width:100%;height:100%;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-around;justify-content:space-around}
#prompt{font-size:7vmin;font-weight:800;text-align:center;background:#fff;border-radius:4vmin;padding:1.5vmin 4vmin;-webkit-box-shadow:0 .8vmin 0 rgba(0,0,0,.13);box-shadow:0 .8vmin 0 rgba(0,0,0,.13);cursor:pointer}
#stage{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center;-webkit-align-items:center;align-items:center;max-width:96vw;min-height:30vmin}
.item{position:relative;cursor:pointer;padding:.5vmin;margin:.5vmin 1vmin}
.item.done{-webkit-animation:bounce .5s;animation:bounce .5s}
.item .b{position:absolute;right:-.5vmin;bottom:-.5vmin;background:#ff4d8d;color:#fff;font-size:5.5vmin;font-weight:800;line-height:1;
  min-width:1.5em;height:1.5em;border-radius:50%;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;-webkit-box-shadow:0 .5vmin 0 rgba(0,0,0,.2);box-shadow:0 .5vmin 0 rgba(0,0,0,.2)}
.group{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center;-webkit-align-items:center;align-items:center;-webkit-align-content:center;align-content:center;background:rgba(255,255,255,.8);border:1vmin solid #fff;border-radius:4vmin;
  padding:2vmin;margin:0 1vw;width:44vw;min-height:34vmin;cursor:pointer;-webkit-box-shadow:0 1vmin 0 rgba(0,0,0,.13);box-shadow:0 1vmin 0 rgba(0,0,0,.13)}
.group:active{-webkit-transform:translateY(.6vmin);transform:translateY(.6vmin)}
.group .e{margin:.5vmin}
.op{font-size:14vmin;font-weight:800;color:#ff4d8d;margin:0 2vmin}
.eq{font-size:11vmin;font-weight:800;text-align:center;width:100%}
#opts{display:-webkit-flex;display:flex;-webkit-justify-content:center;justify-content:center}
.opt{width:24vmin;height:24vmin;margin:0 1.5vmin;border-radius:5vmin;font-size:15vmin;font-weight:800;color:#fff;cursor:pointer;
  -webkit-box-shadow:0 1.2vmin 0 rgba(0,0,0,.2);box-shadow:0 1.2vmin 0 rgba(0,0,0,.2);display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;line-height:1;text-align:center}
.opt small{font-size:4.5vmin;font-weight:700;margin-top:.5vmin}
.opt:active{-webkit-transform:translateY(1vmin);transform:translateY(1vmin);-webkit-box-shadow:0 .2vmin 0 rgba(0,0,0,.2);box-shadow:0 .2vmin 0 rgba(0,0,0,.2)}
.o0{background:#ff7a59}.o1{background:#3fb6ff}.o2{background:#a66bff}
.shake{-webkit-animation:shake .4s;animation:shake .4s}.dim{opacity:.35}
@-webkit-keyframes shake{25%{-webkit-transform:translateX(-1.5vmin) rotate(-4deg)}75%{-webkit-transform:translateX(1.5vmin) rotate(4deg)}}
@keyframes shake{25%{transform:translateX(-1.5vmin) rotate(-4deg)}75%{transform:translateX(1.5vmin) rotate(4deg)}}
@-webkit-keyframes bounce{40%{-webkit-transform:scale(1.4) rotate(-8deg)}}
@keyframes bounce{40%{transform:scale(1.4) rotate(-8deg)}}
@-webkit-keyframes pop{40%{-webkit-transform:scale(1.35)}}
@keyframes pop{40%{transform:scale(1.35)}}
#praise{position:fixed;left:50%;top:42%;-webkit-transform:translate(-50%,-50%) scale(0);transform:translate(-50%,-50%) scale(0);font-size:13vmin;font-weight:800;color:#fff;
  -webkit-text-stroke:.8vmin #ff4d8d;text-align:center;pointer-events:none;z-index:20;white-space:nowrap}
#praise.show{-webkit-animation:praise 1.8s ease-out;animation:praise 1.8s ease-out}
@-webkit-keyframes praise{0%{-webkit-transform:translate(-50%,-50%) scale(0)}20%{-webkit-transform:translate(-50%,-50%) scale(1.15)}30%{-webkit-transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{-webkit-transform:translate(-50%,-70%) scale(1);opacity:0}}
@keyframes praise{0%{transform:translate(-50%,-50%) scale(0)}20%{transform:translate(-50%,-50%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
.fall{position:fixed;top:-10vmin;pointer-events:none;z-index:15;-webkit-animation:fall 2.4s ease-in forwards;animation:fall 2.4s ease-in forwards}
@-webkit-keyframes fall{to{-webkit-transform:translateY(115vh) rotate(540deg)}}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
</style>
</head>
<body ontouchstart="">
<div class="cloud" style="top:8%;-webkit-animation-delay:-10s;animation-delay:-10s"><svg data-icon="cloud" data-vm="24" data-r="0.6" viewBox="0 0 100 60"></svg></div>
<div class="cloud" style="top:22%;-webkit-animation-delay:-35s;animation-delay:-35s"><svg data-icon="cloud" data-vm="16" data-r="0.6" viewBox="0 0 100 60"></svg></div>

<header>
  <button class="pill" id="home"><svg data-icon="home" data-vm="8" viewBox="0 0 100 100"></svg></button>
  <span id="spacer"></span>
  <div class="right">
    <button class="pill" id="snd" title="Klank"><svg data-icon="soundOn" data-vm="8" viewBox="0 0 100 100"></svg></button>
    <div class="pill" id="stars"><svg data-icon="star" data-vm="8" viewBox="0 0 100 100"></svg><span id="starN">0</span></div>
  </div>
</header>

<main>
  <div id="menuWrap">
    <h1>Kom speel met syfers!</h1>
    <div id="menu">
      <div class="card c1" data-g="tel"><span><svg data-icon="apple" data-vm="17" viewBox="0 0 100 100"></svg></span>Tel</div>
      <div class="card c2" data-g="syfer"><span><svg data-icon="four" data-vm="17" viewBox="0 0 100 100"></svg></span>Syfers</div>
      <div class="card c3" data-g="meer"><span><svg data-icon="scale" data-vm="17" viewBox="0 0 100 100"></svg></span>Wie het meer?</div>
      <div class="card c4" data-g="plus"><span><svg data-icon="plus" data-vm="17" viewBox="0 0 100 100"></svg></span>Bymekaar</div>
    </div>
  </div>
  <div id="play" class="hide">
    <div id="prompt"></div>
    <div id="stage"></div>
    <div id="opts"></div>
  </div>
</main>
<div id="praise"></div>

<script>
(function(){
var W=['nul','een','twee','drie','vier','vyf','ses','sewe','agt','nege','tien'];
var PRAISE=['Mooi so!','Fantasties!','Slim seun!','Wonderlik!','Jy is \'n ster!','Hoera!','Fiks!'];
var COLORS=['#ff4d8d','#ffd23f','#3fb6ff','#a66bff','#2fc77a','#ff7a59'];

/* ---------- prentjies (SVG, werk op enige grootte) ---------- */
var ICON={
apple:'<circle cx="50" cy="58" r="34" fill="#ff4d4d"/><ellipse cx="38" cy="46" rx="7" ry="11" fill="#ff9a9a" opacity=".7"/><rect x="48" y="14" width="5" height="17" rx="2" fill="#7a4a21"/><path d="M53 22 C66 8 82 14 80 24 C70 30 58 28 53 22 Z" fill="#3bb54a"/>',
star:'<polygon points="50,6 62,37 95,39 69,60 78,93 50,75 22,93 31,60 5,39 38,37" fill="#ffd23f" stroke="#f5a300" stroke-width="4" stroke-linejoin="round"/>',
ball:'<circle cx="50" cy="50" r="40" fill="#3fb6ff" stroke="#1d86cc" stroke-width="4"/><path d="M12 52 Q50 84 88 52" stroke="#fff" stroke-width="9" fill="none"/><circle cx="34" cy="30" r="8" fill="#fff" opacity=".5"/>',
fish:'<polygon points="66,50 95,26 95,74" fill="#ff9f1c"/><ellipse cx="42" cy="50" rx="34" ry="25" fill="#ff7a59"/><path d="M52 29 Q62 50 52 71" stroke="#ff9f1c" stroke-width="5" fill="none"/><circle cx="27" cy="44" r="6" fill="#fff"/><circle cx="26" cy="44" r="3" fill="#222"/>',
balloon:'<ellipse cx="50" cy="40" rx="28" ry="33" fill="#ff4d8d"/><ellipse cx="39" cy="27" rx="7" ry="11" fill="#fff" opacity=".45"/><polygon points="50,71 43,82 57,82" fill="#e0306f"/><path d="M50 82 Q42 90 50 97" stroke="#555" stroke-width="3" fill="none"/>',
flower:'<g fill="#ff7ac8"><circle cx="50" cy="24" r="17"/><circle cx="76" cy="43" r="17"/><circle cx="66" cy="74" r="17"/><circle cx="34" cy="74" r="17"/><circle cx="24" cy="43" r="17"/></g><circle cx="50" cy="54" r="15" fill="#ffd23f"/>',
chick:'<circle cx="50" cy="54" r="36" fill="#ffd93b"/><polygon points="41,54 59,54 50,66" fill="#ff8a00"/><circle cx="37" cy="44" r="5" fill="#222"/><circle cx="63" cy="44" r="5" fill="#222"/>',
cookie:'<circle cx="50" cy="50" r="38" fill="#d9a05b" stroke="#a8702f" stroke-width="3"/><circle cx="36" cy="38" r="5" fill="#5a3416"/><circle cx="62" cy="34" r="5" fill="#5a3416"/><circle cx="56" cy="58" r="5" fill="#5a3416"/><circle cx="34" cy="62" r="5" fill="#5a3416"/><circle cx="70" cy="64" r="4" fill="#5a3416"/>',
heart:'<path d="M50 88 C10 58 10 22 33 20 C43 19 48 26 50 31 C52 26 57 19 67 20 C90 22 90 58 50 88 Z" fill="#ff4d6d"/>',
home:'<polygon points="50,12 92,50 80,50 80,88 20,88 20,50 8,50" fill="#ff7a59" stroke="#c4491f" stroke-width="3" stroke-linejoin="round"/><rect x="42" y="58" width="16" height="30" fill="#fff"/>',
soundOn:'<polygon points="8,38 28,38 52,16 52,84 28,62 8,62" fill="#3b2a6b"/><path d="M64 36 Q76 50 64 64" stroke="#3b2a6b" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M75 24 Q97 50 75 76" stroke="#3b2a6b" stroke-width="7" fill="none" stroke-linecap="round"/>',
soundOff:'<polygon points="8,38 28,38 52,16 52,84 28,62 8,62" fill="#3b2a6b"/><path d="M66 38 L94 66 M94 38 L66 66" stroke="#ff4d8d" stroke-width="9" stroke-linecap="round"/>',
four:'<text x="50" y="80" font-size="92" font-weight="800" text-anchor="middle" fill="#fff" font-family="Chalkboard SE,Comic Sans MS,Helvetica,Arial,sans-serif">4</text>',
plus:'<path d="M50 14 V86 M14 50 H86" stroke="#fff" stroke-width="18" stroke-linecap="round"/>',
scale:'<rect x="46" y="14" width="8" height="68" fill="#fff"/><rect x="22" y="82" width="56" height="9" rx="4" fill="#fff"/><rect x="10" y="24" width="80" height="8" rx="4" fill="#fff"/><path d="M22 32 L8 58 M22 32 L36 58 M78 32 L64 58 M78 32 L92 58" stroke="#fff" stroke-width="3" fill="none"/><path d="M6 58 A16 12 0 0 0 38 58 Z" fill="#fff"/><path d="M62 58 A16 12 0 0 0 94 58 Z" fill="#fff"/>',
eyes:'<circle cx="28" cy="50" r="24" fill="#fff" stroke="#333" stroke-width="3"/><circle cx="72" cy="50" r="24" fill="#fff" stroke="#333" stroke-width="3"/><circle cx="34" cy="53" r="10" fill="#222"/><circle cx="78" cy="53" r="10" fill="#222"/>',
cloud:'<g fill="#fff"><circle cx="28" cy="38" r="20"/><circle cx="52" cy="28" r="26"/><circle cx="76" cy="38" r="20"/><rect x="28" y="38" width="48" height="20"/></g>'
};
var NAMES=['apple','star','ball','fish','balloon','flower','chick','cookie','heart'];
function vm(n){var m=Math.min(window.innerWidth||768,window.innerHeight||1024);return Math.round(m*n/100)}
function icon(name,px,ratio){
  return '<svg width="'+px+'" height="'+Math.round(px*(ratio||1))+'" viewBox="0 0 100 '+Math.round(100*(ratio||1))+'">'+ICON[name]+'</svg>';
}
function sizeIcons(){
  var els=document.querySelectorAll('svg[data-icon]');
  for(var i=0;i<els.length;i++){
    var s=els[i],px=vm(+s.getAttribute('data-vm')),r=+s.getAttribute('data-r')||1;
    s.setAttribute('width',px);s.setAttribute('height',Math.round(px*r));
    if(!s.hasChildNodes())s.innerHTML=ICON[s.getAttribute('data-icon')];
  }
}
sizeIcons();
window.addEventListener('resize',sizeIcons);
window.addEventListener('orientationchange',sizeIcons);

function $(s){return document.querySelector(s)}
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function pick(a){return a[rnd(0,a.length-1)]}
function restart(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}

var stars=0,correct=0,game=null,locked=false,counter=0,soundOn=true,ans=0,eqText='';
try{stars=+localStorage.getItem('wk_stars')||0}catch(e){}
$('#starN').textContent=stars;

/* ---------- klank ---------- */
var ac=null;
function ctx(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(ac&&ac.state==='suspended'&&ac.resume)ac.resume();
  return ac;
}
function tone(f,d,t,delay,v){
  if(!soundOn)return;
  var c=ctx();if(!c)return;
  d=d||.15;t=t||'sine';delay=delay||0;v=v||.25;
  try{
    var o=c.createOscillator(),g=c.createGain();
    o.type=t;o.frequency.value=f;
    var s=c.currentTime+delay;
    g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.02);
    g.gain.exponentialRampToValueAtTime(.001,s+d);
    o.connect(g);g.connect(c.destination);
    if(o.start){o.start(s);o.stop(s+d+.05)}else{o.noteOn(s);o.noteOff(s+d+.05)}
  }catch(e){}
}
function sPop(n){tone(400+n*50,.12,'triangle')}
function sWin(){var fs=[523,659,784,1047];for(var i=0;i<fs.length;i++)tone(fs[i],.25,'triangle',i*.1)}
function sOops(){tone(250,.2,'sine',0,.2);tone(200,.25,'sine',.15,.2)}

/* ---------- stem (Afrikaans, indien beskikbaar) ---------- */
var voice=null;
function findVoice(){
  if(!('speechSynthesis' in window))return;
  var vs=speechSynthesis.getVoices();voice=null;
  for(var i=0;i<vs.length;i++){if(/^af/i.test(vs[i].lang)){voice=vs[i];break}}
}
if('speechSynthesis' in window){findVoice();speechSynthesis.onvoiceschanged=findVoice}
function say(t){
  if(!soundOn||!voice)return;
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);
    u.voice=voice;u.lang=voice.lang;u.rate=.8;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}
}

/* ---------- hulpfunksies ---------- */
function maxN(){return Math.min(10,3+Math.floor(correct/3))}
function setPrompt(t,spoken){
  var p=$('#prompt');p.textContent=t;p.setAttribute('data-say',spoken||t);say(spoken||t);
}
$('#prompt').onclick=function(){say(this.getAttribute('data-say'))};
function sizeFor(n){return vm(n<=3?24:n<=6?18:13)}

function opts(right,max,sub){
  var arr=[right],guard=0;
  while(arr.length<3&&guard++<50){
    var v=rnd(1,Math.max(max+1,4));
    if(arr.indexOf(v)<0)arr.push(v);
  }
  arr.sort(function(){return Math.random()-.5});
  var box=$('#opts');box.innerHTML='';
  arr.forEach(function(v,i){
    var b=document.createElement('div');b.className='opt o'+i;
    b.innerHTML=v+(sub?'<small>'+W[v]+'</small>':'');
    b.onclick=function(){
      ctx();if(locked)return;sPop(v);say(W[v]);
      if(v===right)win();else wrong(b);
    };
    box.appendChild(b);
  });
}
function wrong(el){
  restart(el,'shake');
  sOops();setTimeout(function(){say('Probeer weer')},350);
  if(el.classList.contains('opt'))el.classList.add('dim');
}
function win(){
  locked=true;correct++;stars++;
  if(game==='plus'&&eqText){$('#opts').innerHTML='<div class="eq">'+eqText+'</div>'}
  try{localStorage.setItem('wk_stars',stars)}catch(e){}
  $('#starN').textContent=stars;restart($('#stars'),'pop');
  sWin();confetti();
  var pr=pick(PRAISE),el=$('#praise');el.textContent=pr;restart(el,'show');
  setTimeout(function(){say(pr)},300);
  setTimeout(next,2300);
}
function confetti(){
  for(var i=0;i<30;i++){
    var s=document.createElement('div'),sz=vm(rnd(3,6));
    s.className='fall';
    s.style.width=sz+'px';s.style.height=sz+'px';
    s.style.background=pick(COLORS);
    s.style.borderRadius=Math.random()<.5?'50%':'20%';
    s.style.left=rnd(0,95)+'vw';
    s.style.webkitAnimationDelay=s.style.animationDelay=(Math.random()*.6)+'s';
    document.body.appendChild(s);
    (function(el){setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},3200)})(s);
  }
}
function makeItem(px,name,tappable){
  var b=document.createElement('div');b.className='item';b.innerHTML=icon(name,px);
  if(tappable){
    b.onclick=function(){
      ctx();if(b.classList.contains('done'))return;
      counter++;b.classList.add('done');
      var bd=document.createElement('span');bd.className='b';bd.textContent=counter;b.appendChild(bd);
      sPop(counter);say(W[counter]);
    };
  }
  return b;
}
function items(parent,n,name,tappable){
  var px=sizeFor(n);
  for(var i=0;i<n;i++)parent.appendChild(makeItem(px,name,tappable));
}

/* ---------- speletjies ---------- */
var games={
  tel:function(){
    var n=rnd(1,maxN()),name=pick(NAMES);ans=n;
    setPrompt('Tel saam met my!');
    var st=$('#stage');st.innerHTML='';items(st,n,name,true);
    opts(n,maxN(),false);
  },
  syfer:function(){
    var n=rnd(1,Math.max(5,maxN()));ans=n;
    setPrompt('Waar is die '+W[n]+'?');
    $('#stage').innerHTML='<div class="item">'+icon('eyes',vm(28))+'</div>';
    opts(n,Math.max(5,maxN()),false);
  },
  meer:function(){
    var m=Math.min(8,maxN()+1),a=rnd(1,m),b=rnd(1,m);
    while(a===b)b=rnd(1,m);
    var name=pick(NAMES),name2=Math.random()<.5?name:pick(NAMES);
    var st=$('#stage');st.innerHTML='';$('#opts').innerHTML='';
    setPrompt('Watter kant het meer?');
    var mx=Math.max(a,b),px=vm(mx<=3?17:mx<=5?13:10);
    [[a,name],[b,name2]].forEach(function(p){
      var n=p[0],nm=p[1],g=document.createElement('div'),h='';
      g.className='group';
      for(var k=0;k<n;k++)h+='<span class="e">'+icon(nm,px)+'</span>';
      g.innerHTML=h;
      g.onclick=function(){
        ctx();if(locked)return;
        if(n===Math.max(a,b)){sPop(n);say(W[n]);win()}else wrong(g);
      };
      st.appendChild(g);
    });
  },
  plus:function(){
    var m=Math.min(10,Math.max(3,maxN()));
    var a=rnd(1,m-1),b=rnd(1,Math.min(m-a,5));ans=a+b;
    var name=pick(NAMES);counter=0;eqText=a+' + '+b+' = '+ans;
    setPrompt('Hoeveel is dit saam?','Hoeveel is dit saam? '+W[a]+' plus '+W[b]);
    var st=$('#stage');st.innerHTML='';
    var g1=document.createElement('div'),g2=document.createElement('div'),op=document.createElement('div');
    [g1,g2].forEach(function(g){g.style.cssText='display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center;max-width:36vw'});
    op.className='op';op.textContent='+';
    items(g1,a,name,true);
    items(g2,b,pick(NAMES.filter(function(x){return x!==name})),true);
    st.appendChild(g1);st.appendChild(op);st.appendChild(g2);
    opts(ans,m,false);
  }
};

function next(){
  locked=false;counter=0;
  games[game]();
}
function start(g){
  game=g;ctx();
  $('#menuWrap').classList.add('hide');$('#play').classList.remove('hide');
  next();
}
function home(){
  game=null;locked=true;
  try{speechSynthesis.cancel()}catch(e){}
  $('#play').classList.add('hide');$('#menuWrap').classList.remove('hide');
}
var cards=document.querySelectorAll('.card');
for(var ci=0;ci<cards.length;ci++){
  (function(c){c.onclick=function(){start(c.getAttribute('data-g'))}})(cards[ci]);
}
$('#home').onclick=function(){if(game)home();else location.href='index.html'};
$('#snd').onclick=function(){
  soundOn=!soundOn;
  this.innerHTML='<svg data-icon="'+(soundOn?'soundOn':'soundOff')+'" data-vm="8" viewBox="0 0 100 100"></svg>';
  sizeIcons();
  if(!soundOn){try{speechSynthesis.cancel()}catch(e){}}
};
})();
</script>
</body>
</html>
