function restart(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
function vm(n){var m=Math.min(window.innerWidth||768,window.innerHeight||1024);return Math.round(m*n/100)}
function icon(name,px,ratio){var r=ratio||1;return '<svg width="'+px+'" height="'+Math.round(px*r)+'" viewBox="0 0 100 '+Math.round(100*r)+'">'+ICON[name]+'</svg>'}
function sizeIcons(){
  var els=document.querySelectorAll('svg[data-icon]');
  for(var i=0;i<els.length;i++){
    var s=els[i],px=vm(+s.getAttribute('data-vm')),r=+s.getAttribute('data-r')||1;
    s.setAttribute('width',px);s.setAttribute('height',Math.round(px*r));
    if(!s.hasChildNodes())s.innerHTML=ICON[s.getAttribute('data-icon')];
  }
}
window.addEventListener('resize',sizeIcons);
window.addEventListener('orientationchange',sizeIcons);

/* ---------- klank ---------- */
var ac=null,soundOn=true;
function ctx(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(ac&&ac.state==='suspended'&&ac.resume)ac.resume();
  return ac;
}
function tone(f,d,t,delay,v){
  if(!soundOn)return;
  var c=ctx();if(!c)return;
  d=d||.15;t=t||'sine';delay=delay||0;v=v||.25;
  try{
    var o=c.createOscillator(),g=c.createGain();
    o.type=t;o.frequency.value=f;
    var s=c.currentTime+delay;
    g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.02);
    g.gain.exponentialRampToValueAtTime(.001,s+d);
    o.connect(g);g.connect(c.destination);
    if(o.start){o.start(s);o.stop(s+d+.05)}else{o.noteOn(s);o.noteOff(s+d+.05)}
  }catch(e){}
}
function sPop(f){tone(f||(500+Math.random()*300),.12,'triangle')}
function sWin(){var fs=[523,659,784,1047];for(var i=0;i<fs.length;i++)tone(fs[i],.25,'triangle',i*.1)}
function sOops(){tone(250,.2,'sine',0,.2);tone(200,.25,'sine',.15,.2)}

/* ---------- stem (Afrikaans, indien beskikbaar) ---------- */
var voice=null;
function findVoice(){
  if(!('speechSynthesis' in window))return;
  var vs=speechSynthesis.getVoices();voice=null;
  for(var i=0;i<vs.length;i++){if(/^af/i.test(vs[i].lang)){voice=vs[i];break}}
}
if('speechSynthesis' in window){findVoice();speechSynthesis.onvoiceschanged=findVoice}
function say(t){
  if(!soundOn||!voice||!t)return;
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);
    u.voice=voice;u.lang=voice.lang;u.rate=.8;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}
}
function cancelSpeech(){try{speechSynthesis.cancel()}catch(e){}}

/* ---------- viering ---------- */
function confetti(){
  for(var i=0;i<30;i++){
    var s=document.createElement('div'),sz=vm(rnd(3,6));
    s.className='fall';
    s.style.width=sz+'px';s.style.height=sz+'px';
    s.style.background=pick(COLORS);
    s.style.borderRadius=Math.random()<.5?'50%':'20%';
    s.style.left=rnd(0,95)+'vw';
    s.style.webkitAnimationDelay=s.style.animationDelay=(Math.random()*.6)+'s';
    document.body.appendChild(s);
    (function(el){setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},3200)})(s);
  }
}
function celebrate(sayText){
  sWin();confetti();
  var pr=pick(PRAISE),el=$('#praise');el.textContent=pr;restart(el,'show');
  setTimeout(function(){say(sayText||pr)},300);
}
function Stars(key){
  var n=0;try{n=+localStorage.getItem(key)||0}catch(e){}
  $('#starN').textContent=n;
  return {add:function(){n++;try{localStorage.setItem(key,n)}catch(e){}$('#starN').textContent=n;restart($('#stars'),'pop')}};
}
function initSound(){
  var b=$('#snd');if(!b)return;
  b.onclick=function(){
    soundOn=!soundOn;
    b.innerHTML='<svg data-icon="'+(soundOn?'soundOn':'soundOff')+'" data-vm="8" viewBox="0 0 100 100"></svg>';
    sizeIcons();
    if(!soundOn)cancelSpeech();
  };
}
function isSound(){return soundOn}
function setSound(v){soundOn=!!v;if(!soundOn)cancelSpeech()}

return {W:W,ICON:ICON,LETTER_PICS:LETTER_PICS,THINGS:THINGS,NAMEAF:NAMEAF,$:$,rnd:rnd,pick:pick,shuf:shuf,restart:restart,vm:vm,icon:icon,sizeIcons:sizeIcons,
  ctx:ctx,tone:tone,sPop:sPop,sWin:sWin,sOops:sOops,say:say,cancelSpeech:cancelSpeech,confetti:confetti,celebrate:celebrate,Stars:Stars,initSound:initSound,isSound:isSound,setSound:setSound};
})();
</script>
<script>
(function(){
var $=WK.$,rnd=WK.rnd,pick=WK.pick,shuf=WK.shuf,vm=WK.vm;
var COLORS=['c_red','c_blue','c_yellow','c_green','c_purple','c_orange'];
var THINGS=['apple','dog','cat','star','frog','strawberry','ladybug','car'];
var NAME={c_red:'rooi',c_blue:'blou',c_yellow:'geel',c_green:'groen',c_purple:'pers',c_orange:'oranje',
  apple:'appel',dog:'hond',cat:'kat',star:'ster',frog:'padda',strawberry:'aarbei',ladybug:'kewer',car:'motor'};
var CAT={diere:['dog','cat','frog','fish','duck','lion','bear','chick'],
  kos:['apple','banana','strawberry','carrot','cookie','watermelon','tomato','pie'],
  voertuie:['car','bus','bicycle','plane','train','boat']};
var CATN={diere:'Diere',kos:'Kos',voertuie:'Voertuie'};
var DIRS={op:{dx:0,dy:-1,i:'aUp',s:'sUp'},af:{dx:0,dy:1,i:'aDown',s:'sDown'},links:{dx:-1,dy:0,i:'aLeft',s:'sLeft'},regs:{dx:1,dy:0,i:'aRight',s:'sRight'}};
var DKEYS=['op','af','links','regs'];

var correct=0,game=null,locked=true,reveal=null,revealSay=null,stars=WK.Stars('kd_stars');

function setPrompt(t,spoken){var p=$('#prompt');p.textContent=t;p.setAttribute('data-say',spoken||t);WK.say(spoken||t)}
$('#prompt').onclick=function(){WK.say(this.getAttribute('data-say'))};
function buildOpts(items){
  var box=$('#opts');box.innerHTML='';
  var arr=shuf(items);
  for(var i=0;i<arr.length;i++)(function(it,i){
    var b=document.createElement('div');b.className='opt '+(it.cls||'')+' o'+i;b.innerHTML=it.html;
    b.onclick=function(){WK.ctx();if(locked)return;WK.sPop();if(it.say)WK.say(it.say);
      if(it.ok)win();else wrong(b)};
    box.appendChild(b);
  })(arr[i],i);
}
function wrong(el){
  WK.restart(el,'shake');
  WK.sOops();setTimeout(function(){WK.say('Probeer weer')},350);el.classList.add('dim');
}
function win(){
  locked=true;correct++;stars.add();
  if(reveal)$('#stage').innerHTML=reveal;
  WK.celebrate(revealSay);
  setTimeout(next,revealSay?3600:2500);
}
function uniq(s){var r=[];for(var i=0;i<s.length;i++)if(r.indexOf(s.charAt(i))<0)r.push(s.charAt(i));return r}
function without(a,x){var r=[];for(var i=0;i<a.length;i++)if(a[i]!==x)r.push(a[i]);return r}
function pic(n,px){return WK.icon(n,px)}

/* patrone */
function genPat(mode){
  var kinds=correct<3?['AB']:correct<6?['AB','AAB','ABB']:['AB','AAB','ABB','ABC','AABB'];
  var k=pick(kinds),per=k.length;
  var pool=shuf(Math.random()<.5?COLORS:THINGS),letters=uniq(k),map={};
  for(var i=0;i<letters.length;i++)map[letters[i]]=pool[i];
  var L=mode==='next'?per*2+rnd(1,per):per*3;
  var seq=[];for(var j=0;j<L;j++)seq.push(map[k.charAt(j%per)]);
  var hidden=mode==='next'?L-1:rnd(per,L-2);
  var right=seq[hidden];
  var alt=shuf(without(pool,right)).slice(0,2);
  return {seq:seq,hidden:hidden,right:right,alt:alt};
}
function seqHTML(seq,hidden,filled){
  var px=vm(seq.length>8?8.5:seq.length>6?10:12),box=Math.round(px*1.25),h='<div class="seq">';
  for(var i=0;i<seq.length;i++){
    if(i===hidden&&!filled)h+='<div class="sq q" style="width:'+box+'px;height:'+box+'px;font-size:'+Math.round(px*.8)+'px">?</div>';
    else h+='<div class="sq'+(i===hidden?' fill':'')+'" style="width:'+box+'px;height:'+box+'px">'+pic(seq[i],px)+'</div>';
  }
  return h+'</div>';
}
function patGame(mode){
  var p=genPat(mode);
  var shown=mode==='next'?p.seq.slice(0,p.hidden+1):p.seq;
  setPrompt(mode==='next'?'Watter een kom volgende?':'Watter een ontbreek?');
  $('#stage').innerHTML=seqHTML(shown,p.hidden,false);
  reveal=seqHTML(shown,p.hidden,true);
  var nm=[];for(var i=0;i<shown.length;i++)nm.push(NAME[shown[i]]);
  revealSay=nm.join(', ');
  var items=[{html:pic(p.right,vm(14)),cls:'pic',ok:true,say:NAME[p.right]}];
  for(var j=0;j<p.alt.length;j++)items.push({html:pic(p.alt[j],vm(14)),cls:'pic',say:NAME[p.alt[j]]});
  buildOpts(items);
}

/* sorteer */
function sortGame(){
  var cats=shuf(['diere','kos','voertuie']).slice(0,2),right=cats[0],item=pick(CAT[right]);
  reveal=pic(item,vm(24))+'<div class="word">Hoort by '+CATN[right]+'!</div>';revealSay=null;
  setPrompt('Waar hoort dit?');
  $('#stage').innerHTML=pic(item,vm(24));
  var items=[];
  for(var i=0;i<cats.length;i++)items.push({html:pic('basket',vm(13))+'<span>'+CATN[cats[i]]+'</span>',cls:'bin',ok:cats[i]===right,say:CATN[cats[i]]});
  buildOpts(items);
}

/* robot */
var LV={
  1:{name:'Maklik',N:3,min:1,max:3,every:3,obs:0,obsOn:1,slots:6},
  2:{name:'Middelmatig',N:4,min:2,max:4,every:3,obs:2,obsOn:2,slots:8},
  3:{name:'Moeilik',N:5,min:4,max:7,every:2,obs:4,obsOn:4,slots:12}};
var RS={lvl:1,obs:false,touched:false,won:0};
var OBSE=['rock','tree','cone'];
function robotMenu(){
  locked=false;reveal=null;revealSay=null;
  setPrompt('Kies hoe moeilik!');
  $('#opts').innerHTML='';
  var st=$('#stage'),ip=vm(13);
  st.innerHTML='<div class="lvs">'+
    '<div class="lv l1" data-l="1">'+pic('sprout',ip)+'Maklik<small>klein bord</small></div>'+
    '<div class="lv l2" data-l="2">'+pic('bush',ip)+'Middelmatig<small>groter bord</small></div>'+
    '<div class="lv l3" data-l="3">'+pic('tree',ip)+'Moeilik<small>groot bord</small></div></div>'+
    '<div class="pill" id="ob" style="margin-top:2vmin"></div>';
  function upd(){
    var t=!RS.touched?'Hindernisse: volgens vlak':RS.obs?'Hindernisse: AAN':'Hindernisse: AF';
    $('#ob').innerHTML=pic('rock',vm(7))+'<span style="font-size:5vmin">'+t+'</span>';
  }
  upd();
  $('#ob').onclick=function(){WK.ctx();RS.obs=RS.touched?!RS.obs:true;RS.touched=true;WK.sPop();upd()};
  var bs=st.querySelectorAll('.lv');
  for(var i=0;i<bs.length;i++)(function(b){b.onclick=function(){
    WK.ctx();RS.lvl=+b.getAttribute('data-l');RS.won=0;
    if(!RS.touched)RS.obs=RS.lvl>1;
    WK.say(LV[RS.lvl].name);robotGame();
  }})(bs[i]);
}
function genRobot(N,steps,nobs){
  for(var tries=0;tries<1000;tries++){
    var sx=rnd(0,N-1),sy=rnd(0,N-1),x=sx,y=sy,last=null,ok=true,vis=[[sx,sy]];
    for(var i=0;i<steps;i++){
      var ds=[],ks=shuf(DKEYS);
      for(var q=0;q<ks.length;q++){
        var d0=DIRS[ks[q]],nx=x+d0.dx,ny=y+d0.dy;
        if(nx>=0&&ny>=0&&nx<N&&ny<N&&!(last&&last.dx+d0.dx===0&&last.dy+d0.dy===0))ds.push(d0);
      }
      if(!ds.length){ok=false;break}
      var d=ds[0];x+=d.dx;y+=d.dy;last=d;vis.push([x,y]);
    }
    if(!ok||(x===sx&&y===sy))continue;
    var free=[];
    for(var yy=0;yy<N;yy++)for(var xx=0;xx<N;xx++){
      var seen=false;for(var v=0;v<vis.length;v++)if(vis[v][0]===xx&&vis[v][1]===yy){seen=true;break}
      if(!seen)free.push([xx,yy]);
    }
    if(free.length<nobs)continue;
    var keyed=[];
    for(var f=0;f<free.length;f++){
      var m=999;for(var w=0;w<vis.length;w++){var dd=Math.abs(vis[w][0]-free[f][0])+Math.abs(vis[w][1]-free[f][1]);if(dd<m)m=dd}
      keyed.push({c:free[f],k:m+(Math.random()-.5)*1.6});
    }
    keyed.sort(function(a,b){return a.k-b.k});
    var obs=[];for(var o=0;o<nobs;o++)obs.push(keyed[o].c);
    return {sx:sx,sy:sy,gx:x,gy:y,obs:obs};
  }
  return {sx:0,sy:0,gx:1,gy:0,obs:[]};
}
function robotGame(){
  reveal=null;revealSay=null;locked=false;
  var L=LV[RS.lvl],N=L.N,steps=Math.min(L.max,L.min+Math.floor(RS.won/L.every));
  var nobs=RS.obs?L.obsOn:0;
  var g=genRobot(N,steps,nobs),sx=g.sx,sy=g.sy,gx=g.gx,gy=g.gy,obs=g.obs;
  var blocked={};for(var i=0;i<obs.length;i++)blocked[obs[i][0]+','+obs[i][1]]=1;
  var oe=pick(OBSE);
  var C=vm(N===3?14:N===4?11.5:8.4),G=vm(1),maxSlots=Math.min(L.slots,steps+5);
  setPrompt(nobs?'Vermy die hindernisse!':'Help die robot by die ster!','Help die robot by die ster!'+(nobs?' Vermy die hindernisse!':''));
  $('#opts').innerHTML='';
  var st=$('#stage'),bw=N*C+(N+1)*G;
  var ab=vm(8);
  st.innerHTML='<div class="rob"><div class="board" id="bd" style="width:'+bw+'px;height:'+bw+'px"></div>'+
   '<div class="panel"><div class="prog" id="pg"></div>'+
    '<div class="arow"><div class="ab sp"></div><div class="ab up" data-d="op">'+pic('aUp',ab)+'</div><div class="ab sp"></div></div>'+
    '<div class="arow"><div class="ab lf" data-d="links">'+pic('aLeft',ab)+'</div><div class="ab dn" data-d="af">'+pic('aDown',ab)+'</div><div class="ab rt" data-d="regs">'+pic('aRight',ab)+'</div></div>'+
    '<div class="ctl"><div class="go" id="go">'+pic('play',vm(6))+'Gaan!</div><div class="un" id="un">'+pic('undo',vm(9))+'</div></div></div></div>';
  var bd=$('#bd');
  for(var y=0;y<N;y++)for(var x=0;x<N;x++){
    var isO=!!blocked[x+','+y],isG=(x===gx&&y===gy);
    var c=document.createElement('div');
    c.className='cell'+((x+y)%2?' alt':'')+(isG?' goal':'')+(isO?' obs':'');
    c.style.width=C+'px';c.style.height=C+'px';c.style.left=(G+x*(C+G))+'px';c.style.top=(G+y*(C+G))+'px';
    if(isG)c.innerHTML=pic('star',Math.round(C*.8));else if(isO)c.innerHTML=pic(oe,Math.round(C*.8));
    bd.appendChild(c);
  }
  var rb=document.createElement('div');rb.id='rb';rb.style.width=C+'px';rb.style.height=C+'px';
  rb.innerHTML=pic('robot',Math.round(C*.82));bd.appendChild(rb);
  function place(x,y){rb.style.left=(G+x*(C+G))+'px';rb.style.top=(G+y*(C+G))+'px'}
  place(sx,sy);
  var prog=[];
  function render(on){
    var h='';
    for(var i=0;i<prog.length;i++)h+='<div class="sl'+(i===on?' on':'')+'">'+pic(DIRS[prog[i]].s,vm(5.5))+'</div>';
    $('#pg').innerHTML=prog.length?h:'<span class="hint">Tik die pyltjies</span>';
  }
  render();
  var abs=document.querySelectorAll('.ab');
  for(var a=0;a<abs.length;a++)(function(b){
    if(!b.getAttribute('data-d'))return;
    b.onclick=function(){
      WK.ctx();if(locked||prog.length>=maxSlots)return;
      var d=b.getAttribute('data-d');prog.push(d);WK.sPop(400+prog.length*60);WK.say(d);render();
    };
  })(abs[a]);
  $('#un').onclick=function(){if(locked)return;prog.pop();WK.sPop(300);render()};
  $('#go').onclick=function(){
    WK.ctx();if(locked||!prog.length)return;locked=true;
    place(sx,sy);
    var x=sx,y=sy,i=0;
    function finish(){
      render();
      if(x===gx&&y===gy){rb.innerHTML=pic('robotHappy',Math.round(C*.82));RS.won++;win()}
      else{WK.sOops();WK.say('Probeer weer');setTimeout(function(){place(sx,sy);locked=false},900)}
    }
    function step(){
      if(i>=prog.length){setTimeout(finish,600);return}
      render(i);
      setTimeout(function(){
        var d=DIRS[prog[i]],nx=x+d.dx,ny=y+d.dy;
        if(nx<0||ny<0||nx>=N||ny>=N||blocked[nx+','+ny]){WK.restart(rb,'bump');WK.sOops()}
        else{x=nx;y=ny;place(x,y);WK.sPop(400+i*80)}
        i++;step();
      },550);
    }
    setTimeout(function(){WK.say('Gaan!');step()},500);
  };
}

var games={volgende:function(){patGame('next')},ontbreek:function(){patGame('mid')},sorteer:sortGame,robot:robotGame};
function next(){locked=false;games[game]()}
function start(g){
  game=g;WK.ctx();$('#menuWrap').classList.add('hide');$('#play').classList.remove('hide');
  if(g==='robot')$('#lvl').classList.remove('hide');else $('#lvl').classList.add('hide');
  if(g==='robot')robotMenu();else next();
}
function menu(){game=null;locked=true;$('#lvl').classList.add('hide');WK.cancelSpeech();$('#play').classList.add('hide');$('#menuWrap').classList.remove('hide')}
var cards=document.querySelectorAll('.card');
for(var i=0;i<cards.length;i++)(function(c){c.onclick=function(){start(c.getAttribute('data-g'))}})(cards[i]);
$('#home').onclick=function(){if(game)menu();else location.href='index.html'};
$('#lvl').onclick=function(){WK.ctx();if(game==='robot')robotMenu()};
WK.initSound();
WK.sizeIcons();
})();
</script>
