<style>

svg{display:block}

.opt:active{-webkit-transform:translateY(1vmin);transform:translateY(1vmin);-webkit-box-shadow:0 .2vmin 0 rgba(0,0,0,.2);box-shadow:0 .2vmin 0 rgba(0,0,0,.2)}

.boing{-webkit-animation:boing .5s;animation:boing .5s}

body{background:#e0fbf3;background:-webkit-linear-gradient(#b8f0e0 0%,#e0fbf3 55%,#ffe58a 55.1%,#ffd24d 100%);background:linear-gradient(#b8f0e0 0%,#e0fbf3 55%,#ffe58a 55.1%,#ffd24d 100%)}

.eq span{margin:0 1vmin}

.grp>*{margin:0 .8vmin}

.it.done{-webkit-animation:bounce .5s;animation:bounce .5s}
.it .b2{position:absolute;right:-.5vmin;bottom:-.5vmin;background:#ff4d8d;color:#fff;font-size:3.6vmin;font-weight:800;width:5.4vmin;height:5.4vmin;border-radius:50%;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}

.gop{font-size:8vmin;font-weight:800;color:#ff4d8d}

function icon(name,px,ratio){var r=ratio||1;return '<svg width="'+px+'" height="'+Math.round(px*r)+'" viewBox="0 0 100 '+Math.round(100*r)+'">'+ICON[name]+'</svg>'}
function sizeIcons(){
  var els=document.querySelectorAll('svg[data-icon]');
  for(var i=0;i<els.length;i++){
    var s=els[i],px=vm(+s.getAttribute('data-vm')),r=+s.getAttribute('data-r')||1;
    s.setAttribute('width',px);s.setAttribute('height',Math.round(px*r));
    if(!s.hasChildNodes())s.innerHTML=ICON[s.getAttribute('data-icon')];
  }
}
window.addEventListener('resize',sizeIcons);
window.addEventListener('orientationchange',sizeIcons);

/* ---------- klank ---------- */
var ac=null,soundOn=true;
function ctx(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(ac&&ac.state==='suspended'&&ac.resume)ac.resume();
  return ac;
}
function tone(f,d,t,delay,v){
  if(!soundOn)return;
  var c=ctx();if(!c)return;
  d=d||.15;t=t||'sine';delay=delay||0;v=v||.25;
  try{
    var o=c.createOscillator(),g=c.createGain();
    o.type=t;o.frequency.value=f;
    var s=c.currentTime+delay;
    g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.02);
    g.gain.exponentialRampToValueAtTime(.001,s+d);
    o.connect(g);g.connect(c.destination);
    if(o.start){o.start(s);o.stop(s+d+.05)}else{o.noteOn(s);o.noteOff(s+d+.05)}
  }catch(e){}
}
function sPop(f){tone(f||(500+Math.random()*300),.12,'triangle')}
function sWin(){var fs=[523,659,784,1047];for(var i=0;i<fs.length;i++)tone(fs[i],.25,'triangle',i*.1)}
function sOops(){tone(250,.2,'sine',0,.2);tone(200,.25,'sine',.15,.2)}

/* ---------- stem (Afrikaans, indien beskikbaar) ---------- */
var voice=null;
function findVoice(){
  if(!('speechSynthesis' in window))return;
  var vs=speechSynthesis.getVoices();voice=null;
  for(var i=0;i<vs.length;i++){if(/^af/i.test(vs[i].lang)){voice=vs[i];break}}
}
if('speechSynthesis' in window){findVoice();speechSynthesis.onvoiceschanged=findVoice}
function say(t){
  if(!soundOn||!voice||!t)return;
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);
    u.voice=voice;u.lang=voice.lang;u.rate=.8;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}
}
function cancelSpeech(){try{speechSynthesis.cancel()}catch(e){}}

/* ---------- viering ---------- */
function confetti(){
  for(var i=0;i<30;i++){
    var s=document.createElement('div'),sz=vm(rnd(3,6));
    s.className='fall';
    s.style.width=sz+'px';s.style.height=sz+'px';
    s.style.background=pick(COLORS);
    s.style.borderRadius=Math.random()<.5?'50%':'20%';
    s.style.left=rnd(0,95)+'vw';
    s.style.webkitAnimationDelay=s.style.animationDelay=(Math.random()*.6)+'s';
    document.body.appendChild(s);
    (function(el){setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},3200)})(s);
  }
}
function celebrate(sayText){
  sWin();confetti();
  var pr=pick(PRAISE),el=$('#praise');el.textContent=pr;restart(el,'show');
  setTimeout(function(){say(sayText||pr)},300);
}
function Stars(key){
  var n=0;try{n=+localStorage.getItem(key)||0}catch(e){}
  $('#starN').textContent=n;
  return {add:function(){n++;try{localStorage.setItem(key,n)}catch(e){}$('#starN').textContent=n;restart($('#stars'),'pop')}};
}
function initSound(){
  var b=$('#snd');if(!b)return;
  b.onclick=function(){
    soundOn=!soundOn;
    b.innerHTML='<svg data-icon="'+(soundOn?'soundOn':'soundOff')+'" data-vm="8" viewBox="0 0 100 100"></svg>';
    sizeIcons();
    if(!soundOn)cancelSpeech();
  };
}
function isSound(){return soundOn}
function setSound(v){soundOn=!!v;if(!soundOn)cancelSpeech()}

return {W:W,ICON:ICON,LETTER_PICS:LETTER_PICS,THINGS:THINGS,NAMEAF:NAMEAF,$:$,rnd:rnd,pick:pick,shuf:shuf,restart:restart,vm:vm,icon:icon,sizeIcons:sizeIcons,
  ctx:ctx,tone:tone,sPop:sPop,sWin:sWin,sOops:sOops,say:say,cancelSpeech:cancelSpeech,confetti:confetti,celebrate:celebrate,Stars:Stars,initSound:initSound,isSound:isSound,setSound:setSound};
})();

};
var LW=WK.LETTER_PICS;
var EM=['apple','dog','cat','frog','ladybug','car','star','fish','balloon','strawberry','chick','flower','bear','ball'];
var CHARS={digits:'0123456789'.split(''),upper:'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),lower:'abcdefghijklmnopqrstuvwxyz'.split('')};

var correct=0,game=null,locked=true,reveal=null,revealSay=null,counter=0,stars=WK.Stars('sr_stars');
function pic(n,px,cls){var s=WK.icon(n,px);return cls?s.replace('<svg ','<svg class="'+cls+'" '):s}

function setPrompt(t,spoken){var p=$('#prompt');p.textContent=t;p.setAttribute('data-say',spoken||t);WK.say(spoken||t)}
$('#prompt').onclick=function(){WK.say(this.getAttribute('data-say'))};
function buildOpts(vals,right){
  var box=$('#opts');box.innerHTML='';
  for(var i=0;i<vals.length;i++)(function(v,i){
    var b=document.createElement('div');b.className='opt o'+i;b.textContent=v;
    b.onclick=function(){WK.ctx();if(locked)return;WK.sPop();WK.say(W[v]);if(v===right)win();else wrong(b)};
    box.appendChild(b);
  })(vals[i],i);
}
function choices(right,mx){
  var set=[right],g=0;
  while(set.length<3&&g++<80){var v=rnd(1,Math.max(mx+1,4));if(set.indexOf(v)<0)set.push(v)}
  return shuf(set);
}
function wrong(el){
  WK.restart(el,'shake');
  WK.sOops();setTimeout(function(){WK.say('Probeer weer')},350);el.classList.add('dim');
}
function win(){
  locked=true;correct++;stars.add();
  if(reveal)$('#stage').innerHTML=reveal;
  WK.celebrate(revealSay);
  setTimeout(next,revealSay?3200:2400);
}

/* =================== NATREK =================== */
var T={mode:null,chars:[],idx:0,strokes:[],samples:[],fingers:{},ball:null,demoOn:false,advance:false,k:1,done:{},timer:null};
var cv=null,cg=null,demoRAF=null,last={},mouseId=null;
var R=10.5;
var raf=window.requestAnimationFrame||window.webkitRequestAnimationFrame||function(f){return setTimeout(f,16)};
var caf=window.cancelAnimationFrame||window.webkitCancelAnimationFrame||clearTimeout;
function loadDone(m){try{T.done[m]=JSON.parse(localStorage.getItem('sr_done_'+m)||'{}')}catch(e){T.done[m]={}}}
function saveDone(m){try{localStorage.setItem('sr_done_'+m,JSON.stringify(T.done[m]))}catch(e){}}

function setupCanvas(){
  var r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=Math.max(10,Math.round(r.width*dpr));cv.height=cv.width;T.k=cv.width/100;cg=cv.getContext('2d');
}
function sampleStrokes(ch){
  var svg=$('#meas');T.strokes=[];T.samples=[];
  var G=GL[ch];
  for(var si=0;si<G.length;si++){
    var p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',G[si]);svg.appendChild(p);
    var L=p.getTotalLength(),n0=T.samples.length;
    for(var l=0;l<=L;l+=2){var q=p.getPointAtLength(l);T.samples.push({x:q.x,y:q.y,s:si,t:false})}
    var e=p.getPointAtLength(L);T.samples.push({x:e.x,y:e.y,s:si,t:false});
    svg.removeChild(p);T.strokes.push({n0:n0,n1:T.samples.length});
  }
}
function cover(){var n=0;for(var i=0;i<T.samples.length;i++)if(T.samples[i].t)n++;return n/T.samples.length}
function nextStroke(){
  for(var i=0;i<T.strokes.length;i++){var s=T.strokes[i],t=0;for(var j=s.n0;j<s.n1;j++)if(T.samples[j].t)t++;
    if(t/(s.n1-s.n0)<.6)return i}
  return -1;
}
function dash(g,a){if(g.setLineDash)g.setLineDash(a)}
function strokeAll(g){
  for(var i=0;i<T.strokes.length;i++){
    var s=T.strokes[i];g.beginPath();
    for(var j=s.n0;j<s.n1;j++){var q=T.samples[j];if(j===s.n0)g.moveTo(q.x,q.y);else g.lineTo(q.x,q.y)}
    g.stroke();
  }
}
function draw(){
  if(!cg)return;var g=cg,k=T.k,i;
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);g.setTransform(k,0,0,k,0,0);
  g.lineCap='round';g.lineJoin='round';
  if(T.mode==='lower'){
    g.lineWidth=.8;g.strokeStyle='#cfc6ee';
    var ys=[14,38,72],ds=[[],[3,3],[]];
    for(i=0;i<3;i++){dash(g,ds[i]);g.beginPath();g.moveTo(4,ys[i]);g.lineTo(96,ys[i]);g.stroke()}
    dash(g,[]);
  }
  g.strokeStyle='#e6defb';g.lineWidth=13;strokeAll(g);
  g.strokeStyle='#b4a8e0';g.lineWidth=1.1;dash(g,[2,3.5]);strokeAll(g);dash(g,[]);
  var N=T.samples.length;
  for(i=0;i<N;i++){var s=T.samples[i];if(!s.t)continue;
    g.fillStyle='hsl('+Math.round(i/N*300)+', 85%, 58%)';g.beginPath();g.arc(s.x,s.y,6.6,0,6.3);g.fill()}
  var ns=nextStroke();
  if(ns>=0&&!T.demoOn&&!locked){
    var q=T.samples[T.strokes[ns].n0];
    g.fillStyle='#2fc77a';g.beginPath();g.arc(q.x,q.y,7.5,0,6.3);g.fill();
    g.fillStyle='#fff';g.font='bold 9px sans-serif';g.textAlign='center';g.textBaseline='middle';
    if(T.strokes.length>1)g.fillText(String(ns+1),q.x,q.y+.6);
    else{g.beginPath();g.arc(q.x,q.y,2.4,0,6.3);g.fill()}
  }
  for(var id in T.fingers){if(!T.fingers.hasOwnProperty(id))continue;var f=T.fingers[id];
    g.fillStyle='rgba(255,77,141,.35)';g.beginPath();g.arc(f.x,f.y,8,0,6.3);g.fill()}
  if(T.ball){g.fillStyle='#ff4d8d';g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(T.ball.x,T.ball.y,6,0,6.3);g.fill();g.stroke()}
}
function updProg(){
  var c=Math.min(1,cover()/.9),n=Math.floor(c*5+1e-9),sp=document.querySelectorAll('#prog span');
  for(var i=0;i<sp.length;i++){if(i<n)sp[i].classList.add('on');else sp[i].classList.remove('on')}
}
function pt(cx,cy){var r=cv.getBoundingClientRect();return {x:(cx-r.left)/r.width*100,y:(cy-r.top)/r.height*100}}
function segDist2(px,py,ax,ay,bx,by){
  var dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy,t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=Math.max(0,Math.min(1,t));
  var x=ax+t*dx-px,y=ay+t*dy-py;return x*x+y*y;
}
function touchSeg(a,b){
  var n=0;
  for(var i=0;i<T.samples.length;i++){var s=T.samples[i];
    if(!s.t&&segDist2(s.x,s.y,a.x,a.y,b.x,b.y)<=R*R){s.t=true;n++}}
  if(n)WK.sPop(350+cover()*500);
  return n;
}
function pDown(id,cx,cy){
  WK.ctx();clearTimeout(T.timer);if(locked||T.demoOn)return false;
  var p=pt(cx,cy);last[id]=p;T.fingers[id]=p;touchSeg(p,p);updProg();draw();return true;
}
function pMove(id,cx,cy){
  var l=last[id];if(!l||locked)return;var p=pt(cx,cy);
  touchSeg(l,p);last[id]=p;T.fingers[id]=p;updProg();draw();
}
function pUp(id){delete last[id];delete T.fingers[id];draw();checkDone()}
function bindCanvas(){
  last={};T.fingers={};
  function each(e,fn){e.preventDefault();for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];fn('t'+t.identifier,t.clientX,t.clientY)}}
  cv.addEventListener('touchstart',function(e){each(e,pDown)},false);
  cv.addEventListener('touchmove',function(e){each(e,pMove)},false);
  cv.addEventListener('touchend',function(e){each(e,function(id){pUp(id)})},false);
  cv.addEventListener('touchcancel',function(e){each(e,function(id){pUp(id)})},false);
  cv.addEventListener('mousedown',function(e){e.preventDefault();if(pDown('m',e.clientX,e.clientY))mouseId='m'},false);
}
document.addEventListener('mousemove',function(e){if(mouseId)pMove('m',e.clientX,e.clientY)},false);
document.addEventListener('mouseup',function(){if(mouseId){mouseId=null;pUp('m')}},false);

function markOk(b){if(!b||b.querySelector('.st'))return;b.classList.add('ok');var s=document.createElement('span');s.className='st';s.innerHTML=pic('star',vm(3.6));b.appendChild(s)}
function checkDone(){
  if(locked||T.demoOn||cover()<.9)return;
  var ch=T.chars[T.idx];
  for(var i=0;i<T.samples.length;i++)T.samples[i].t=true;
  updProg();draw();
  T.done[T.mode][ch]=1;saveDone(T.mode);T.advance=true;
  revealSay=charSpeech(ch);reveal=null;
  markOk(document.querySelector('.sb[data-i="'+T.idx+'"]'));
  win();
}
function charSpeech(ch){
  if(/\d/.test(ch))return W[+ch];
  var w=LW[ch.toUpperCase()];return w?ch.toUpperCase()+' van '+w[0].toLowerCase():ch.toUpperCase();
}
function hintHTML(ch){
  var h,i;
  if(/\d/.test(ch)){
    var n=+ch,e=EM[(n*3)%EM.length],px=vm(n>5?5.4:6.5),its='';
    for(i=0;i<n;i++)its+=pic(e,px);
    if(!n)its=pic('basket',vm(8));
    return '<div class="hz">'+ch+'</div><div class="items">'+its+'</div><div class="hw">'+W[n]+'</div>';
  }
  var w=LW[ch.toUpperCase()];
  return '<div class="hz">'+ch.toUpperCase()+ch.toLowerCase()+'</div>'+(w?pic(w[1],vm(11))+'<div class="hw">'+w[0].toLowerCase()+'</div>':'');
}
function promptText(ch){
  if(/\d/.test(ch))return ['Trek die '+ch+' na!','Trek die '+W[+ch]+' na!'];
  return ['Trek die '+ch+' na!','Trek die letter '+ch.toUpperCase()+' na!'];
}
function demo(){
  if(locked)return;caf(demoRAF);
  for(var k=0;k<T.samples.length;k++)T.samples[k].t=false;
  updProg();
  T.demoOn=true;var i=0,N=T.samples.length;
  function step(){
    if(!T.demoOn)return;
    if(i>=N){T.ball=null;T.demoOn=false;draw();return}
    T.ball=T.samples[Math.floor(i)];i+=1.6;draw();demoRAF=raf(step);
  }
  step();
}
function clearTrace(){clearTimeout(T.timer);caf(demoRAF);T.demoOn=false;T.ball=null;for(var i=0;i<T.samples.length;i++)T.samples[i].t=false;updProg();draw()}
function loadChar(){
  locked=false;
  if(T.advance){T.idx=(T.idx+1)%T.chars.length;T.advance=false}
  var ch=T.chars[T.idx],pr=promptText(ch);
  setPrompt(pr[0],pr[1]);
  $('#opts').innerHTML='';
  var stp='';for(var s=0;s<5;s++)stp+='<span>'+pic('star',vm(6))+'</span>';
  $('#stage').innerHTML='<div class="trrow"><canvas id="cv"></canvas><div class="side"><div class="hint">'+hintHTML(ch)+'</div>'+
    '<div id="prog">'+stp+'</div>'+
    '<div class="btns"><div class="pill" id="dm">'+pic('eyes',vm(6),null)+'Wys my</div><div class="pill" id="cl">'+pic('eraser',vm(6))+'Oor</div></div></div></div><div class="sel" id="sel"></div>';
  cv=$('#cv');setupCanvas();bindCanvas();sampleStrokes(ch);
  $('#dm').onclick=function(){WK.ctx();demo()};$('#cl').onclick=function(){WK.ctx();clearTrace()};
  var sel=$('#sel');
  for(var i=0;i<T.chars.length;i++)(function(c,i){
    var b=document.createElement('div');b.className='sb'+(i===T.idx?' cur':'');
    b.setAttribute('data-i',i);b.textContent=c;
    b.onclick=function(){WK.ctx();WK.sPop();caf(demoRAF);T.demoOn=false;T.ball=null;T.idx=i;T.advance=false;loadChar()};
    sel.appendChild(b);
    if(T.done[T.mode][c])markOk(b);
  })(T.chars[i],i);
  updProg();draw();clearTimeout(T.timer);
  T.timer=setTimeout(function(){
    var nf=0;for(var k in T.fingers)if(T.fingers.hasOwnProperty(k))nf++;
    if(game===T.mode&&T.chars[T.idx]===ch&&!locked&&cover()===0&&!nf)demo();
  },700);
}
window.addEventListener('resize',function(){if(cv&&T.mode&&game){setupCanvas();draw()}});

/* =================== GETALSINNE =================== */
function mxN(){return Math.min(10,4+Math.floor(correct/3))}
function grp(n,em,gone){
  gone=gone||0;
  var d=document.createElement('div');d.className='gset';
  var px=vm(n>6?7:9);
  for(var i=0;i<n;i++)(function(i){
    var isGone=i>=n-gone,b=document.createElement('div');
    b.className='it'+(isGone?' gone':'');b.innerHTML=pic(em,px,'pic');
    if(isGone){var x=document.createElement('span');x.className='x';x.innerHTML=pic('xmark',Math.round(px*.8));b.appendChild(x)}
    else b.onclick=function(){
      WK.ctx();if(b.classList.contains('done'))return;counter++;b.classList.add('done');
      var bd=document.createElement('span');bd.className='b2';bd.textContent=counter;b.appendChild(bd);WK.sPop(400+counter*50);WK.say(W[counter]);
    };
    d.appendChild(b);
  })(i);
  return d;
}
function eqHTML(a,op,b,r,qpos){
  function f(v,c,q){return '<span class="'+c+(q?' q':'')+'">'+(q?'?':v)+'</span>'}
  return '<div class="eq">'+f(a,'a',qpos==='a')+'<span class="op">'+op+'</span>'+f(b,'b',qpos==='b')+'<span class="op">=</span>'+f(r,'r',qpos==='r')+'</div>';
}
function sentence(a,op,b,r){return W[a]+' '+(op==='+'?'plus':'min')+' '+W[b]+' is '+W[r]}
function gop(t){var s=document.createElement('span');s.className='gop';s.textContent=t;return s}
var games={
  plus:function(){
    var m=mxN(),a=rnd(1,m-1),b=rnd(1,Math.min(m-a,5)),r=a+b,em=pick(EM),em2=Math.random()<.5?em:pick(EM);
    setPrompt('Hoeveel is dit saam?',W[a]+' plus '+W[b]+' is hoeveel?');
    var st=$('#stage');st.innerHTML=eqHTML(a,'+',b,r,'r');
    var row=document.createElement('div');row.className='grp';
    row.appendChild(grp(a,em));row.appendChild(gop('+'));row.appendChild(grp(b,em2));st.appendChild(row);
    reveal=eqHTML(a,'+',b,r,null);revealSay=sentence(a,'+',b,r);
    buildOpts(choices(r,m),r);
  },
  min:function(){
    var m=mxN(),a=rnd(2,m),b=rnd(1,a-1),r=a-b,em=pick(EM);
    setPrompt('Hoeveel bly oor?',W[a]+' min '+W[b]+' is hoeveel?');
    var st=$('#stage');st.innerHTML=eqHTML(a,'−',b,r,'r');
    var row=document.createElement('div');row.className='grp';row.appendChild(grp(a,em,b));st.appendChild(row);
    reveal=eqHTML(a,'−',b,r,null);revealSay=sentence(a,'-',b,r);
    buildOpts(choices(r,m),r);
  },
  miss:function(){
    var m=mxN(),c=rnd(2,m),a=rnd(1,c-1),b=c-a,em=pick(EM);
    setPrompt('Watter getal ontbreek?',W[a]+' plus hoeveel is '+W[c]+'?');
    var st=$('#stage');st.innerHTML=eqHTML(a,'+',b,c,'b');
    var row=document.createElement('div');row.className='grp';
    var q=document.createElement('div');q.className='qbox';q.textContent='?';
    row.appendChild(grp(a,em));row.appendChild(gop('+'));row.appendChild(q);row.appendChild(gop('='));row.appendChild(grp(c,em));st.appendChild(row);
    reveal=eqHTML(a,'+',b,c,null);revealSay=sentence(a,'+',b,c);
    buildOpts(choices(b,m),b);
  }
};
games.digits=games.upper=games.lower=loadChar;

function next(){locked=false;counter=0;reveal=null;revealSay=null;games[game]()}
function start(g){
  game=g;WK.ctx();
  if(CHARS[g]){
    T.mode=g;T.chars=CHARS[g];loadDone(g);T.advance=false;
    var idx=0;for(var i=0;i<T.chars.length;i++)if(!T.done[g][T.chars[i]]){idx=i;break}
    T.idx=idx;
  }
  $('#menuWrap').classList.add('hide');$('#play').classList.remove('hide');next();
}
function menu(){
  clearTimeout(T.timer);game=null;locked=true;T.demoOn=false;caf(demoRAF);WK.cancelSpeech();
  $('#play').classList.add('hide');$('#menuWrap').classList.remove('hide');
}
var cards=document.querySelectorAll('.card');
for(var ci=0;ci<cards.length;ci++)(function(c){c.onclick=function(){start(c.getAttribute('data-g'))}})(cards[ci]);
$('#home').onclick=function(){if(game)menu();else location.href='index.html'};
WK.initSound();
WK.sizeIcons();
})();
</script>
