<!DOCTYPE html>
<html lang="af" manifest="cache.appcache">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vorms">
<title>Vorms en Meting!</title>
<link rel="stylesheet" href="base.css">
<style>
body{background:#ffe9cc;background:-webkit-linear-gradient(#ffe0b8 0%,#fff3de 55%,#ffd1a3 55.1%,#ffb877 100%);background:linear-gradient(#ffe0b8 0%,#fff3de 55%,#ffd1a3 55.1%,#ffb877 100%)}
.big{text-align:center}
.word{font-size:8vmin;font-weight:800;color:#ff4d8d;text-shadow:0 .6vmin 0 #fff;text-align:center;margin-top:1vmin}
.card svg{margin-bottom:1vmin}
.two{display:-webkit-flex;display:flex;-webkit-align-items:stretch;align-items:stretch;-webkit-justify-content:center;justify-content:center}
.pk{background:rgba(255,255,255,.8);border:1vmin solid #fff;border-radius:4vmin;padding:2vmin;min-width:34vmin;min-height:38vmin;margin:0 2vmin;
  display:-webkit-flex;display:flex;-webkit-align-items:flex-end;align-items:flex-end;-webkit-justify-content:center;justify-content:center;cursor:pointer;-webkit-box-shadow:0 1vmin 0 rgba(0,0,0,.13);box-shadow:0 1vmin 0 rgba(0,0,0,.13);position:relative}
.pk:active{-webkit-transform:translateY(.7vmin);transform:translateY(.7vmin)}
.pk.ctr{-webkit-align-items:center;align-items:center}
.rows{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.rows .pk{margin:1.2vmin 0;min-width:86vmin;min-height:0;padding:2.2vmin 3vmin;-webkit-justify-content:flex-start;justify-content:flex-start;-webkit-align-items:center;align-items:center}
.ord{display:-webkit-flex;display:flex;-webkit-align-items:flex-end;align-items:flex-end;-webkit-justify-content:center;justify-content:center}
.ord .pk{min-width:0;min-height:0;margin:0 1.5vmin;padding:1.5vmin 2vmin}
.ord .pk.done{background:#d8ffe5;border-color:#2fc77a}
.badge{position:absolute;right:-1vmin;top:-1.5vmin;background:#ff4d8d;color:#fff;font-size:5.5vmin;font-weight:800;
  width:8vmin;height:8vmin;border-radius:50%;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
</style>
</head>
<body>
<svg class="cloud" style="top:8%;-webkit-animation-delay:-10s;animation-delay:-10s" data-icon="cloud" data-vm="16" data-r=".7" viewBox="0 0 100 70"></svg>
<svg class="cloud" style="top:22%;-webkit-animation-delay:-35s;animation-delay:-35s" data-icon="cloud" data-vm="12" data-r=".7" viewBox="0 0 100 70"></svg>

<header>
  <div class="hg"><div class="pill" id="home"><svg data-icon="home" data-vm="8" viewBox="0 0 100 100"></svg></div></div>
  <div class="hg right">
    <div class="pill" id="snd"><svg data-icon="soundOn" data-vm="8" viewBox="0 0 100 100"></svg></div>
    <div class="pill" id="stars"><svg data-icon="star" data-vm="8" viewBox="0 0 100 100"></svg><span id="starN">0</span></div>
  </div>
</header>

<main>
  <div id="menuWrap">
    <h1>Vorms en meting!</h1>
    <div id="menu" class="m3">
      <div class="card c1" data-g="vorms"><svg data-icon="tri" data-vm="13" viewBox="0 0 100 100"></svg>Vorms</div>
      <div class="card c2" data-g="pas"><svg data-icon="puzzle" data-vm="13" viewBox="0 0 100 100"></svg>Vorm-pas</div>
      <div class="card c3" data-g="groot"><svg data-icon="elephant" data-vm="13" viewBox="0 0 100 100"></svg>Groot of klein</div>
      <div class="card c4" data-g="lank"><svg data-icon="pencil" data-vm="13" viewBox="0 0 100 100"></svg>Lank of kort</div>
      <div class="card c5" data-g="rangskik"><svg data-icon="bars" data-vm="13" viewBox="0 0 100 100"></svg>Rangskik</div>
      <div class="card c6" data-g="swaar"><svg data-icon="scale" data-vm="13" viewBox="0 0 100 100"></svg>Swaar of lig</div>
    </div>
  </div>
  <div id="play" class="hide">
    <div id="prompt"></div>
    <div id="stage"></div>
    <div id="opts"></div>
  </div>
</main>
<div id="praise"></div>

<script src="common.js"></script>
<script>
(function(){
var $=WK.$,rnd=WK.rnd,pick=WK.pick,shuf=WK.shuf,vm=WK.vm,W=WK.W;
var SH=['sirkel','vierkant','driehoek','reghoek','ster','hart','ovaal','ruit'];
var SVGP={
  sirkel:'<circle cx="50" cy="50" r="42" %S/>',
  vierkant:'<rect x="10" y="10" width="80" height="80" rx="5" %S/>',
  driehoek:'<polygon points="50,8 94,88 6,88" stroke-linejoin="round" %S/>',
  reghoek:'<rect x="3" y="27" width="94" height="46" rx="5" %S/>',
  ster:'<polygon points="50,5 61,37 95,37 67,57 78,92 50,72 22,92 33,57 5,37 39,37" stroke-linejoin="round" %S/>',
  hart:'<path d="M50 90 C8 58 4 28 27 19 C40 15 48 23 50 32 C52 23 60 15 73 19 C96 28 92 58 50 90Z" %S/>',
  ovaal:'<ellipse cx="50" cy="50" rx="46" ry="29" %S/>',
  ruit:'<polygon points="50,5 93,50 50,95 7,50" stroke-linejoin="round" %S/>'};
var SHCOL=['#ff5a4d','#3fb6ff','#ffc21a','#2fc77a','#a66bff','#ff7ab8','#ff9a1a'];
var EM=['apple','dog','cat','frog','ladybug','car','star','fish','balloon','strawberry','chick','flower','bear','ball'];
var HEAVY=[['elephant','olifant','mouse','muis'],['rock','klip','feather','veer'],['bus','bus','bicycle','fiets'],['brick','baksteen','balloon','ballon'],['whale','walvis','fish','vis'],['lion','leeu','chick','kuiken']];

var correct=0,game=null,locked=true,reveal=null,revealSay=null,stars=WK.Stars('vm_stars');

function setPrompt(t,spoken){var p=$('#prompt');p.textContent=t;p.setAttribute('data-say',spoken||t);WK.say(spoken||t)}
$('#prompt').onclick=function(){WK.say(this.getAttribute('data-say'))};
function shape(name,color,size,sil){
  var st=sil?'fill="#d9d2ee" stroke="#9a8fc0" stroke-width="3" stroke-dasharray="6 5"':'fill="'+color+'"';
  var px=vm(size);
  return '<svg width="'+px+'" height="'+px+'" viewBox="0 0 100 100">'+SVGP[name].replace('%S',st)+'</svg>';
}
function pic(name,size){return WK.icon(name,vm(size))}
function click(el,fn){
  var moved=false;
  el.addEventListener('click',fn,false);
}
function buildOpts(items){
  var box=$('#opts');box.innerHTML='';
  var arr=shuf(items);
  for(var i=0;i<arr.length;i++)(function(it){
    var b=document.createElement('div');b.className='opt pic';b.innerHTML=it.html;
    b.onclick=function(){WK.ctx();if(locked)return;WK.sPop();if(it.say)WK.say(it.say);
      if(it.ok)win();else wrong(b)};
    box.appendChild(b);
  })(arr[i]);
}
function wrong(el){
  WK.restart(el,'shake');
  WK.sOops();setTimeout(function(){WK.say('Probeer weer')},350);el.classList.add('dim');
}
function win(){
  locked=true;correct++;stars.add();
  if(reveal)$('#stage').innerHTML=reveal;
  WK.celebrate(revealSay);
  setTimeout(next,revealSay?3000:2400);
}
function twoCards(cards,wrapCls){
  var st=$('#stage');st.innerHTML='';$('#opts').innerHTML='';
  var w=document.createElement('div');w.className=wrapCls||'two';
  for(var i=0;i<cards.length;i++)(function(c){
    var b=document.createElement('div');b.className='pk '+(c.cls||'');b.innerHTML=c.html;
    b.onclick=function(){WK.ctx();if(locked)return;WK.sPop();if(c.say)WK.say(c.say);
      if(c.ok)win();else wrong(b)};
    w.appendChild(b);
  })(cards[i]);
  st.appendChild(w);
}
function shPool(){return SH.slice(0,Math.min(SH.length,3+Math.floor(correct/2)))}
function art(n){return "'n "+n}
function without(a,x){var r=[];for(var i=0;i<a.length;i++)if(a[i]!==x)r.push(a[i]);return r}
function pencil(len,color){
  var w=vm(len),h=vm(9),tip=vm(5),pk=vm(5);
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+
    '<polygon points="0,0 '+(w-tip)+',0 '+w+','+(h/2)+' '+(w-tip)+','+h+' 0,'+h+'" fill="'+color+'"/>'+
    '<rect x="0" y="0" width="'+pk+'" height="'+h+'" fill="#ff4d8d"/></svg>';
}

var games={
  vorms:function(){
    var pool=shPool(),r=pick(pool),alt=shuf(without(pool,r)).slice(0,2),cols=shuf(SHCOL);
    setPrompt('Waar is die '+r+'?');
    $('#stage').innerHTML=WK.icon('eyes',vm(24));
    reveal=shape(r,cols[0],24)+'<div class="word">Dit is '+art(r)+'!</div>';revealSay='Dit is '+art(r);
    var all=[r].concat(alt),items=[];
    for(var i=0;i<all.length;i++)items.push({html:shape(all[i],cols[i],16),ok:all[i]===r,say:all[i]});
    buildOpts(items);
  },
  pas:function(){
    var pool=shPool(),r=pick(pool),alt=shuf(without(pool,r)).slice(0,2),cols=shuf(SHCOL);
    setPrompt('Watter vorm pas hier?');
    $('#stage').innerHTML=shape(r,'',24,true);
    var A=art(r);
    reveal=shape(r,cols[0],24)+'<div class="word">'+A.charAt(0).toUpperCase()+A.slice(1)+'!</div>';revealSay=r;
    var all=[r].concat(alt),items=[];
    for(var i=0;i<all.length;i++)items.push({html:shape(all[i],cols[i],16),ok:all[i]===r,say:all[i]});
    buildOpts(items);
  },
  groot:function(){
    var em=pick(EM),big=Math.random()<.5,ratio=correct<6?2:1.5,S=24,s=S/ratio;
    setPrompt(big?'Watter een is groot?':'Watter een is klein?');
    function mk(sz,isBig){return {html:pic(em,sz),ok:isBig===big,say:isBig?'groot':'klein'}}
    twoCards(Math.random()<.5?[mk(S,true),mk(s,false)]:[mk(s,false),mk(S,true)]);
  },
  lank:function(){
    var long=Math.random()<.5,ratio=correct<6?2.2:1.6,L=70,s=L/ratio;
    setPrompt(long?'Watter een is lank?':'Watter een is kort?');
    var cols=shuf(['#ffc21a','#3fb6ff','#2fc77a','#a66bff','#ff9a1a']);
    function mk(len,isLong,c){return {html:pencil(len,c),ok:isLong===long,say:isLong?'lank':'kort',cls:'row'}}
    twoCards(Math.random()<.5?[mk(L,true,cols[0]),mk(s,false,cols[1])]:[mk(s,false,cols[0]),mk(L,true,cols[1])],'rows');
  },
  rangskik:function(){
    var n=correct<6?3:4,em=pick(EM),sizes=n===3?[9,14,20]:[8,12,16,21];
    var desc=correct>=8&&Math.random()<.5;
    var order=desc?sizes.slice().reverse():sizes;
    setPrompt(desc?'Tik van groot na klein!':'Tik van klein na groot!');
    $('#opts').innerHTML='';
    var st=$('#stage');st.innerHTML='';
    var w=document.createElement('div');w.className='ord';
    var idx=0,arr=shuf(sizes);
    for(var i=0;i<arr.length;i++)(function(sz){
      var b=document.createElement('div');b.className='pk ctr';b.innerHTML=pic(em,sz);
      b.onclick=function(){WK.ctx();if(locked||b.classList.contains('done'))return;
        if(sz===order[idx]){
          idx++;b.classList.add('done');WK.restart(b,'boing');
          var bd=document.createElement('span');bd.className='badge';bd.textContent=idx;b.appendChild(bd);
          WK.sPop(400+idx*100);WK.say(W[idx]);
          if(idx===n)setTimeout(win,500);
        }else wrong(b);
      };
      w.appendChild(b);
    })(arr[i]);
    st.appendChild(w);
  },
  swaar:function(){
    var p=pick(HEAVY),heavy=Math.random()<.5;
    setPrompt(heavy?'Watter een is swaar?':'Watter een is lig?');
    function mk(e,n,isH){return {html:pic(e,22),ok:isH===heavy,say:n,cls:'ctr'}}
    var a=mk(p[0],p[1],true),b=mk(p[2],p[3],false);
    twoCards(Math.random()<.5?[a,b]:[b,a]);
  }
};
function next(){locked=false;reveal=null;revealSay=null;games[game]()}
function start(g){game=g;WK.ctx();$('#menuWrap').classList.add('hide');$('#play').classList.remove('hide');next()}
function menu(){game=null;locked=true;WK.cancelSpeech();$('#play').classList.add('hide');$('#menuWrap').classList.remove('hide')}
var cards=document.querySelectorAll('.card');
for(var i=0;i<cards.length;i++)(function(c){c.onclick=function(){start(c.getAttribute('data-g'))}})(cards[i]);
$('#home').onclick=function(){if(game)menu();else location.href='index.html'};
WK.initSound();
WK.sizeIcons();
})();
</script>
</body>
</html>
