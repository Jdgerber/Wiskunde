<!DOCTYPE html>
<html lang="af" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Letters">
<title>Letters en Getalle</title>
<style>
*{-webkit-box-sizing:border-box;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hide{display:none !important}
html,body{height:100%;margin:0}
body{background:#fff3d6;color:#2b2a4c;font-family:'Fredoka','Arial Rounded MT Bold','Chalkboard SE','Trebuchet MS',Helvetica,Arial,sans-serif;overflow:auto;-webkit-overflow-scrolling:touch}
svg{display:block}
.app{max-width:820px;margin:0 auto;min-height:100%;padding:12px 14px 28px}
header{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-bottom:14px}
h1{margin:0;-webkit-flex:1;flex:1;font-size:28px;font-weight:700;line-height:1.15}
.tools{display:-webkit-flex;display:flex}
.icon-btn{width:52px;height:52px;border-radius:50%;border:3px solid #2b2a4c;background:#fff;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;cursor:pointer;-webkit-flex:none;flex:none;margin-right:10px}
.tools .icon-btn{margin-right:0}
.icon-btn.off{background:#ddd8c8}
.lead{margin:0 0 14px;font-size:24px;font-weight:500}

/* menu */
.menu-grid{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.mcard{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;width:47%;margin:1.5% 1.5% 18px;border:4px solid #2b2a4c;border-radius:28px;background:#fff;cursor:pointer;overflow:hidden;-webkit-box-shadow:0 7px 0 #2b2a4c;box-shadow:0 7px 0 #2b2a4c;color:#2b2a4c}
.mcard:active{-webkit-transform:translateY(5px);transform:translateY(5px);-webkit-box-shadow:0 2px 0 #2b2a4c;box-shadow:0 2px 0 #2b2a4c}
.mcard .art{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;padding:22px 10px;border-bottom:4px solid #2b2a4c;font-weight:700}
.mcard .art span{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;width:62px;height:62px;margin:0 6px;border-radius:14px;border:4px solid #2b2a4c;font-size:40px;line-height:1}
.mcard .meta{padding:12px 18px 16px}
.mcard .name{font-size:26px;font-weight:700;line-height:1.15}
.mcard .sub{font-size:18px;font-weight:500;opacity:.8}

/* game board */
.dots{display:-webkit-flex;display:flex;-webkit-justify-content:center;justify-content:center;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin-bottom:10px}
.dots span{width:18px;height:18px;margin:0 4px;border-radius:50%;background:#e6dcc0;border:3px solid #2b2a4c}
.dots span.now{background:#ffb703}
.dots span.done{background:#2fb36d}
.msg{margin:0 0 10px;min-height:2.6em;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;text-align:center;font-size:30px;font-weight:600;line-height:1.2}
.msg b{color:#e5484d}
.grid{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center}
.slot{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.tile{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;border:4px solid #2b2a4c;border-radius:20px;font-weight:700;line-height:1;margin-bottom:8px}
.tile small{font-size:.62em;font-weight:600;margin-left:.08em}
.box{border:4px dashed #8a86b8;border-radius:22px;background:rgba(255,255,255,.55);-webkit-transition:background .2s,border-color .2s;transition:background .2s,border-color .2s}
.slot.hover .box{background:#fff6b8;border-color:#ffb703}
.slot.filled .box{border-style:solid;border-color:#2fb36d;background:#e8fbef}
.slot.filled .tile{-webkit-animation:pop .5s ease-out;animation:pop .5s ease-out}
@-webkit-keyframes pop{40%{-webkit-transform:scale(1.12)}}
@keyframes pop{40%{transform:scale(1.12)}}
.tray{padding-top:6px}
.card{position:relative;border:4px solid #2b2a4c;border-radius:22px;background:#fff;-webkit-box-shadow:0 5px 0 #2b2a4c;box-shadow:0 5px 0 #2b2a4c;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;cursor:pointer;z-index:2}
.card.dragging{z-index:50;-webkit-box-shadow:0 14px 18px rgba(0,0,0,.25);box-shadow:0 14px 18px rgba(0,0,0,.25)}
.card.sel{outline:5px solid #ffb703;outline-offset:3px}
.card.placed{cursor:default;-webkit-box-shadow:none;box-shadow:none;z-index:3;border-color:#2fb36d}
.card.wrong{-webkit-animation:wob .45s;animation:wob .45s}
@-webkit-keyframes wob{20%{margin-left:-8px}40%{margin-left:8px}60%{margin-left:-6px}80%{margin-left:4px}}
@keyframes wob{20%{margin-left:-8px}40%{margin-left:8px}60%{margin-left:-6px}80%{margin-left:4px}}
.card .pic{pointer-events:none;margin-bottom:2px}
.card .word{font-weight:600;line-height:1;pointer-events:none;text-align:center}
.card .word b{color:#e5484d}
.card .grp{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center;-webkit-align-content:center;align-content:center;width:92%;pointer-events:none;margin-bottom:2px}
.card .grp svg{margin:1px}
.card.num .word{visibility:hidden}
.card.num.placed .word{visibility:visible}
.hint{margin:6px 0 10px;text-align:center;font-size:18px;font-weight:500;opacity:.75}
.actions{display:-webkit-flex;display:flex;-webkit-justify-content:center;justify-content:center;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.next{min-height:76px;padding:8px 34px;margin:0 7px 10px;border-radius:38px;border:4px solid #2b2a4c;background:#ffb703;color:#2b2a4c;font-weight:700;font-size:28px;cursor:pointer;-webkit-box-shadow:0 6px 0 #2b2a4c;box-shadow:0 6px 0 #2b2a4c;-webkit-animation:pulse 1.4s ease-in-out infinite;animation:pulse 1.4s ease-in-out infinite;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.next.alt{background:#fff;-webkit-animation:none;animation:none}
.next:active{-webkit-transform:translateY(5px);transform:translateY(5px);-webkit-box-shadow:0 1px 0 #2b2a4c;box-shadow:0 1px 0 #2b2a4c}
@-webkit-keyframes pulse{50%{-webkit-transform:scale(1.05)}}
@keyframes pulse{50%{transform:scale(1.05)}}
.conf{position:fixed;top:-20px;width:12px;height:18px;border-radius:3px;pointer-events:none;z-index:99;-webkit-animation:fall linear forwards;animation:fall linear forwards}
@-webkit-keyframes fall{to{-webkit-transform:translateY(112vh) rotate(540deg);opacity:.9}}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg);opacity:.9}}
</style>
<style id="dyn"></style>
</head>
<body>
<div class="app">
  <header>
    <div class="icon-btn" id="home"></div>
    <h1 id="title">Letters en Getalle</h1>
    <div class="tools"><div class="icon-btn" id="mute"></div></div>
  </header>

  <section id="menu">
    <p class="lead">Wat wil jy speel?</p>
    <div class="menu-grid">
      <div class="mcard" id="m-letters">
        <div class="art"><span style="background:#ffd6d6">A</span><span style="background:#d6ecff">B</span><span style="background:#fff0b8">C</span></div>
        <div class="meta"><div class="name">Letters A–Z</div><div class="sub">Sleep die prentjie na sy letter</div></div>
      </div>
      <div class="mcard" id="m-nums">
        <div class="art"><span style="background:#d9f7de">1</span><span style="background:#e7dcff">2</span><span style="background:#ffe3c4">3</span></div>
        <div class="meta"><div class="name">Getalle 1–10</div><div class="sub">Sleep die groepie na sy getal</div></div>
      </div>
    </div>
  </section>

  <section id="game" class="hide">
    <div class="dots" id="dots"></div>
    <p class="msg" id="msg"></p>
    <div class="grid" id="slots"></div>
    <p class="hint" id="hint"></p>
    <div class="grid tray" id="tray"></div>
    <div class="actions hide" id="actions"></div>
  </section>
</div>

<script src="common.js"></script>
<script>
(function(){
var $=function(id){return document.getElementById(id)};
var menuEl=$('menu'),gameEl=$('game'),titleEl=$('title'),homeBtn=$('home'),muteBtn=$('mute');
var slotsEl=$('slots'),trayEl=$('tray'),msgEl=$('msg'),hintEl=$('hint'),dotsEl=$('dots'),actionsEl=$('actions');
var CW=165;

function each(list,fn){for(var i=0;i<list.length;i++)fn(list[i],i)}
function setT(el,v){el.style.webkitTransform=v;el.style.transform=v}
function setTr(el,v){el.style.webkitTransition=v;el.style.transition=v}

/* ---------- groottes (JS i.p.v. clamp/calc) ---------- */
function ic(name,frac){
  var px=Math.round(CW*frac);
  return '<svg class="ic" data-n="'+name+'" data-f="'+frac+'" width="'+px+'" height="'+px+'" viewBox="0 0 100 100">'+WK.ICON[name]+'</svg>';
}
function applySizes(){
  var w=window.innerWidth||768;
  CW=Math.round(Math.min(168,Math.max(74,w*.215)));
  var gap=Math.round(Math.min(16,Math.max(8,w*.02))),m=gap/2,cw=CW;
  $('dyn').textContent=
    '.slot,.box,.card{width:'+cw+'px}.box,.card{height:'+cw+'px}'+
    '.slot,.card{margin:'+m+'px}'+
    '.tile{height:'+Math.round(cw*.62)+'px;font-size:'+Math.round(cw*.42)+'px}'+
    '.card .word{font-size:'+Math.round(Math.max(12.5,Math.min(cw*.15,24)))+'px}'+
    '.card.num .word{font-size:'+Math.round(Math.max(12.5,Math.min(cw*.13,20.8)))+'px}';
  each(document.querySelectorAll('svg.ic'),function(s){
    var px=Math.round(CW*+s.getAttribute('data-f'));s.setAttribute('width',px);s.setAttribute('height',px);
  });
}
function iconBtn(el,name){el.innerHTML='<svg width="28" height="28" viewBox="0 0 100 100">'+WK.ICON[name]+'</svg>'}
iconBtn(homeBtn,'home');iconBtn(muteBtn,'soundOn');

/* ---------- inhoud ---------- */
var LP=WK.LETTER_PICS,LETTERS=[],AB='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
for(var li=0;li<AB.length;li++)LETTERS.push({L:AB.charAt(li),w:LP[AB.charAt(li)][0],icon:LP[AB.charAt(li)][1]});
var NUMS=[
 {n:1,icon:'apple',t:'Een appel'},{n:2,icon:'duck',t:'Twee eende'},{n:3,icon:'fish',t:'Drie visse'},{n:4,icon:'flower',t:'Vier blomme'},
 {n:5,icon:'star',t:'Vyf sterre'},{n:6,icon:'ball',t:'Ses balle'},{n:7,icon:'strawberry',t:'Sewe aarbeie'},{n:8,icon:'cat',t:'Agt katte'},
 {n:9,icon:'cookie',t:'Nege koekies'},{n:10,icon:'balloon',t:'Tien ballonne'}
];
var COLORS=['#ffd6d6','#d6ecff','#fff0b8','#d9f7de','#e7dcff','#ffe3c4','#ffd9ec'];
function chunk(arr,sizes){var out=[],i=0;for(var k=0;k<sizes.length;k++){out.push(arr.slice(i,i+sizes[k]));i+=sizes[k]}return out}
var GAMES={
  letters:{title:'Letters A–Z',hint:'Sleep elke prentjie na sy letter.',rounds:chunk(LETTERS,[4,4,4,4,4,4,2]),kind:'letter'},
  nums:{title:'Getalle 1–10',hint:'Sleep elke groepie na sy getal.',rounds:chunk(NUMS,[3,3,2,2]),kind:'num'}
};

/* ---------- toestand ---------- */
var game=null,ri=0,filled=0,total=0,selected=null,drag=null,mouseCard=null;
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

function showMenu(){
  game=null;menuEl.classList.remove('hide');gameEl.classList.add('hide');titleEl.textContent='Letters en Getalle';
  WK.cancelSpeech();
}
function startGame(key){
  game=GAMES[key];ri=0;menuEl.classList.add('hide');gameEl.classList.remove('hide');titleEl.textContent=game.title;
  dotsEl.innerHTML='';for(var i=0;i<game.rounds.length;i++)dotsEl.appendChild(document.createElement('span'));
  buildRound();window.scrollTo(0,0);
}
function setDots(){
  each(dotsEl.children,function(d,i){d.className=i<ri?'done':(i===ri?'now':'')});
}
function buildRound(){
  var items=game.rounds[ri];filled=0;total=items.length;selected=null;drag=null;
  slotsEl.innerHTML='';trayEl.innerHTML='';actionsEl.classList.add('hide');actionsEl.innerHTML='';
  msgEl.textContent=game.hint;hintEl.textContent='Of tik die prentjie en dan die letter of getal.';
  setDots();
  each(items,function(it,i){
    var id=game.kind==='letter'?it.L:String(it.n);
    var s=document.createElement('div');s.className='slot';s.setAttribute('data-id',id);
    var col=COLORS[(game.kind==='letter'?AB.indexOf(it.L):it.n)%COLORS.length];
    s.innerHTML='<div class="tile" style="background:'+col+'">'+(game.kind==='letter'?it.L+'<small>'+it.L.toLowerCase()+'</small>':it.n)+'</div><div class="box"></div>';
    s.addEventListener('click',function(){if(selected&&!s.classList.contains('filled'))tryMatch(selected,s)},false);
    slotsEl.appendChild(s);
  });
  each(shuffle(items),function(it){
    var id=game.kind==='letter'?it.L:String(it.n);
    var c=document.createElement('div');c.className='card'+(game.kind==='num'?' num':'');c.setAttribute('data-id',id);c._x=0;c._y=0;
    if(game.kind==='letter'){
      c.innerHTML='<div class="pic">'+ic(it.icon,.5)+'</div><div class="word"><b>'+it.L+'</b>'+it.w.slice(1)+'</div>';
      c._say=it.w;c._after='<b>'+it.L+'</b> is vir <b>'+it.w+'</b>!';c._speak=it.L+' is vir '+it.w.toLowerCase();
    }else{
      var fr=it.n>=7?.2:(it.n>=4?.25:.3),em='';
      for(var k=0;k<it.n;k++)em+=ic(it.icon,fr*.95);
      c.innerHTML='<div class="grp">'+em+'</div><div class="word">'+it.t+'</div>';
      c._say=it.t;c._after='<b>'+it.n+'</b> – '+it.t+'!';c._speak=it.t;
    }
    attachDrag(c);trayEl.appendChild(c);
  });
}

/* ---------- sleep (aanraking + muis) ---------- */
function findTouch(list,id){for(var i=0;i<list.length;i++)if('t'+list[i].identifier===id)return list[i];return null}
function attachDrag(card){
  function start(id,x,y){
    if(card.classList.contains('placed')||drag)return false;
    drag={card:card,id:id,sx:x,sy:y,bx:card._x,by:card._y,moved:false};
    setTr(card,'none');card.classList.add('dragging');return true;
  }
  card._move=function(x,y){
    if(!drag||drag.card!==card)return;
    var dx=x-drag.sx,dy=y-drag.sy;
    if(Math.abs(dx)+Math.abs(dy)>8)drag.moved=true;
    setT(card,'translate('+(drag.bx+dx)+'px,'+(drag.by+dy)+'px) scale(1.1)');
    card._cx=drag.bx+dx;card._cy=drag.by+dy;
    var s=slotUnder(card,x,y);
    each(slotsEl.children,function(el){
      if(el===s&&!el.classList.contains('filled'))el.classList.add('hover');else el.classList.remove('hover');
    });
  };
  card._end=function(x,y){
    if(!drag||drag.card!==card)return;
    var d=drag;drag=null;
    card.classList.remove('dragging');
    each(slotsEl.children,function(el){el.classList.remove('hover')});
    if(!d.moved){
      setTr(card,'-webkit-transform .2s, transform .2s');setT(card,'translate('+card._x+'px,'+card._y+'px)');
      select(card);return;
    }
    var s=slotUnder(card,x,y);
    if(s&&!s.classList.contains('filled'))tryMatch(card,s,true);else giveBack(card);
  };
  card._cancel=function(){
    if(drag&&drag.card===card){drag=null;card.classList.remove('dragging');giveBack(card)}
  };
  card.addEventListener('touchstart',function(e){
    e.preventDefault();var t=e.changedTouches[0];start('t'+t.identifier,t.clientX,t.clientY);
  },false);
  card.addEventListener('touchmove',function(e){
    e.preventDefault();if(!drag||drag.card!==card)return;
    var t=findTouch(e.changedTouches,drag.id);if(t)card._move(t.clientX,t.clientY);
  },false);
  card.addEventListener('touchend',function(e){
    e.preventDefault();if(!drag||drag.card!==card)return;
    var t=findTouch(e.changedTouches,drag.id);if(t)card._end(t.clientX,t.clientY);
  },false);
  card.addEventListener('touchcancel',function(e){
    if(!drag||drag.card!==card)return;
    if(findTouch(e.changedTouches,drag.id))card._cancel();
  },false);
  card.addEventListener('mousedown',function(e){
    e.preventDefault();if(start('m',e.clientX,e.clientY))mouseCard=card;
  },false);
}
document.addEventListener('mousemove',function(e){if(mouseCard)mouseCard._move(e.clientX,e.clientY)},false);
document.addEventListener('mouseup',function(e){if(mouseCard){var c=mouseCard;mouseCard=null;c._end(e.clientX,e.clientY)}},false);

function overlap(a,b){
  var w=Math.min(a.right,b.right)-Math.max(a.left,b.left),h=Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top);
  return (w>0&&h>0)?w*h:0;
}
function slotUnder(card,px,py){
  var cr=card.getBoundingClientRect(),best=null,bestA=0,inside=null;
  each(slotsEl.children,function(s){
    var r=s.getBoundingClientRect();
    if(px>=r.left&&px<=r.right&&py>=r.top&&py<=r.bottom)inside=s;
    var a=overlap(cr,r);if(a>bestA){bestA=a;best=s}
  });
  if(inside)return inside;
  return bestA>cr.width*cr.height*0.3?best:null;
}
function select(card){
  if(selected)selected.classList.remove('sel');
  selected=card;card.classList.add('sel');WK.sPop();WK.say(card._say);
}
function giveBack(card){
  card.classList.remove('sel');if(selected===card)selected=null;
  setTr(card,'-webkit-transform .3s cubic-bezier(.3,1.3,.5,1), transform .3s cubic-bezier(.3,1.3,.5,1)');
  setT(card,'translate(0px,0px)');card._x=0;card._y=0;
}
function snap(card,box,animate){
  var cx=(card._cx!==undefined&&animate)?card._cx:card._x,cy=(card._cy!==undefined&&animate)?card._cy:card._y;
  setTr(card,'none');setT(card,'translate(0px,0px)');
  var c=card.getBoundingClientRect(),b=box.getBoundingClientRect();
  var dx=b.left+b.width/2-(c.left+c.width/2),dy=b.top+b.height/2-(c.top+c.height/2);
  if(animate){setT(card,'translate('+cx+'px,'+cy+'px)');void card.offsetWidth}
  setTr(card,animate?'-webkit-transform .28s cubic-bezier(.3,1.4,.5,1), transform .28s cubic-bezier(.3,1.4,.5,1)':'none');
  setT(card,'translate('+dx+'px,'+dy+'px)');card._x=dx;card._y=dy;card._cx=undefined;card._cy=undefined;
}
function tryMatch(card,slot){
  if(card.getAttribute('data-id')===slot.getAttribute('data-id')){
    if(selected===card)selected=null;card.classList.remove('sel');
    slot.classList.add('filled');card.classList.add('placed');card._slot=slot;
    snap(card,slot.querySelector('.box'),true);
    WK.tone(784,.18,'sine',0,.22);WK.tone(1175,.3,'sine',.12,.22);
    msgEl.innerHTML=card._after;WK.say(card._speak);
    filled++;
    if(filled===total)setTimeout(roundDone,700);
  }else{
    WK.sOops();card.classList.remove('sel');if(selected===card)selected=null;
    msgEl.textContent='Probeer weer!';
    card.classList.add('wrong');setTimeout(function(){card.classList.remove('wrong')},500);
    giveBack(card);
  }
}

/* ---------- einde van rondte ---------- */
function confetti(){
  var cols=['#ff6b6b','#ffa94d','#ffd43b','#69db7c','#4dabf7','#9775fa','#f783ac'];
  for(var i=0;i<46;i++){
    var d=document.createElement('div');d.className='conf';
    d.style.left=(Math.random()*100)+'vw';d.style.background=cols[i%cols.length];
    var dur=(1.6+Math.random()*1.4)+'s',del=(Math.random()*0.4)+'s';
    d.style.webkitAnimationDuration=d.style.animationDuration=dur;
    d.style.webkitAnimationDelay=d.style.animationDelay=del;
    document.body.appendChild(d);
    (function(el){setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},3500)})(d);
  }
}
function roundDone(){
  if(!game)return;
  ri++;setDots();confetti();WK.sWin();
  var last=ri>=game.rounds.length;
  msgEl.textContent=last?(game.kind==='letter'?'Hoera! Jy ken al die letters!':'Hoera! Jy kan tot tien tel!'):'Mooi so! Alles reg!';
  WK.say(last?'Hoera!':'Mooi so!');
  actionsEl.classList.remove('hide');actionsEl.innerHTML='';
  var b=document.createElement('div');b.className='next';
  b.textContent=last?'Speel weer':'Volgende';
  b.addEventListener('click',function(){if(last)ri=0;buildRound();window.scrollTo(0,0)},false);
  actionsEl.appendChild(b);
  if(last){
    var m=document.createElement('div');m.className='next alt';m.textContent='Kies ’n ander speletjie';
    m.addEventListener('click',showMenu,false);actionsEl.appendChild(m);
  }
}

/* ---------- bedrading ---------- */
$('m-letters').addEventListener('click',function(){startGame('letters')},false);
$('m-nums').addEventListener('click',function(){startGame('nums')},false);
homeBtn.addEventListener('click',function(){if(game)showMenu();else location.href='index.html'},false);
muteBtn.addEventListener('click',function(){
  var on=!WK.isSound();WK.setSound(on);
  iconBtn(muteBtn,on?'soundOn':'soundOff');
  if(on)muteBtn.classList.remove('off');else muteBtn.classList.add('off');
},false);
function onResize(){
  applySizes();
  each(trayEl.querySelectorAll('.card.placed'),function(c){if(c._slot)snap(c,c._slot.querySelector('.box'),false)});
}
window.addEventListener('resize',onResize,false);
window.addEventListener('orientationchange',onResize,false);
applySizes();
window.__game={start:startGame,roundDone:roundDone,state:function(){return {ri:ri,filled:filled,total:total}}};
})();
</script>
</body>
</html>
